rules:
  - id: c.openssl.algorithm.pke.rsa-pkcs1
    message: Detected RSA-PKCS1 public key encryption usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<variant>rsaEncryption|RSA|rsa)"'
      - pattern: EVP_PKEY_RSA
      - patterns:
          - pattern: RSA_generate_key($KEYSIZE, $E, $CB, $ARG)
          - metavariable-regex:
              metavariable: $KEYSIZE
              regex: '^(?<keysize>512|1024|2048|3072|4096|8192)$'

    pattern-sinks:
      - patterns:
          - pattern: $API($ALGO, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^EVP_PKEY_CTX_new_id$'
          - focus-metavariable: $ALGO
      - patterns:
          - pattern-either:
              - pattern: $API($A, $ALGO, ...)
              - pattern: $API($A, $B, $ALGO, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^(?:EVP_PKEY_CTX_new_from_name|EVP_PKEY_Q_keygen)$'
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: pke
        algorithmFamily: RSAES-PKCS1
        algorithmName: RSA-PKCS1
        algorithmParameterSetIdentifier: $keysize
        library: OpenSSL
        oid: 1.2.840.113549.1.1.1
        api: $API

  - id: c.openssl.algorithm.pke.rsa-oaep
    message: Detected RSA-OAEP public key encryption usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - pattern: RSA_PKCS1_OAEP_PADDING
      - pattern: EVP_PKEY_CTX_set_rsa_padding($CTX, RSA_PKCS1_OAEP_PADDING)

    pattern-sinks:
      - patterns:
          - pattern: $API($ALGO, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^EVP_PKEY_CTX_new_id$'
          - focus-metavariable: $ALGO
      - patterns:
          - pattern-either:
              - pattern: $API($A, $ALGO, ...)
              - pattern: $API($A, $B, $ALGO, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^(?:EVP_PKEY_CTX_new_from_name|EVP_PKEY_Q_keygen)$'
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: pke
        algorithmFamily: RSAES-OAEP
        algorithmName: RSA-OAEP
        library: OpenSSL
        oid: 1.2.840.113549.1.1.7
        api: $API

  - id: c.openssl.algorithm.pke.rsa-pkcs1.generic
    message: Detected RSA-PKCS1 public key encryption algorithm name
    severity: INFO
    languages: [c]
    patterns:
      - pattern: $ALGO
      - metavariable-regex:
          metavariable: $ALGO
          regex: '"(?<variant>rsaEncryption|RSA|rsa)"'
    metadata:
      category: security
      subcategory: cryptography
      confidence: MEDIUM
      crypto:
        assetType: algorithm
        algorithmPrimitive: pke
        algorithmFamily: RSAES-PKCS1
        algorithmName: RSA-PKCS1
        library: OpenSSL
        oid: 1.2.840.113549.1.1.1
