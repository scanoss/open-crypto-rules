rules:
  - id: c.openssl.algorithm.stream-cipher.rc4
    message: Detected RC4 stream cipher usage
    mode: taint
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $FUNC()
          - metavariable-regex:
              metavariable: $FUNC
              regex: '^EVP_(?<variant>rc4|rc4_40|rc4_hmac_md5)$'
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<variant>RC4|RC4-40|RC4-HMAC-MD5|rc4|rc4-40|rc4-hmac-md5)"'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: EVP_CipherInit_ex($CTX, $ALGO, $ENGINE, $KEY, $IV, $ENC)
              - pattern: EVP_EncryptInit_ex($CTX, $ALGO, $ENGINE, $KEY, $IV)
              - pattern: EVP_DecryptInit_ex($CTX, $ALGO, $ENGINE, $KEY, $IV)
              - pattern: EVP_get_cipherbyname($ALGO)
              - pattern: EVP_CIPHER_fetch($CTX, $ALGO, $PROPS)
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: stream-cipher
        algorithmFamily: RC4
        algorithmName: $variant
        library: OpenSSL
        api: EVP_rc4|EVP_get_cipherbyname|EVP_CipherInit_ex
