rules:
- id: c.openssl.algorithm.stream-cipher.rc4
  message: Detected RC4 stream cipher usage
  mode: taint
  options:
    interfile: true
  severity: INFO
  languages:
  - c
  pattern-sources:
  - patterns:
    - pattern: $FUNC()
    - metavariable-regex:
        metavariable: $FUNC
        regex: ^EVP_(?<variant>rc4|rc4_40|rc4_hmac_md5)$
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<variant>RC4|RC4-40|RC4-HMAC-MD5|rc4|rc4-40|rc4-hmac-md5)"'
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $API($ALGO)
      - pattern: $API($CTX, $ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: ^(?:EVP_get_cipherbyname|EVP_CipherInit_ex|EVP_EncryptInit_ex|EVP_DecryptInit_ex|EVP_CIPHER_fetch)$
    - focus-metavariable: $ALGO
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: stream-cipher
      algorithmFamily: RC4
      algorithmName: $variant
      library: OpenSSL
      api: $API
