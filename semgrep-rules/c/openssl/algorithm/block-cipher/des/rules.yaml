rules:
- id: c.openssl.algorithm.block-cipher.des
  message: Detected DES family block cipher usage
  mode: taint
  severity: INFO
  languages:
  - c
  pattern-sources:
  - patterns:
    - pattern: $FUNC()
    - metavariable-regex:
        metavariable: $FUNC
        regex: ^EVP_(?<variant>des_cbc|des_ecb|des_cfb|des_ofb)$
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<variant>DES-CBC|DES-ECB|DES-CFB|DES-OFB|des-cbc|des-ecb|des-cfb|des-ofb)"'
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $API($ALGO)
      - pattern: $API($CTX, $ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: ^(?:EVP_get_cipherbyname|EVP_CipherInit_ex|EVP_EncryptInit_ex|EVP_DecryptInit_ex|EVP_CIPHER_fetch)$
    - focus-metavariable: $ALGO
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: block-cipher
      algorithmFamily: DES
      algorithmName: $variant
      library: OpenSSL
      api: $API
