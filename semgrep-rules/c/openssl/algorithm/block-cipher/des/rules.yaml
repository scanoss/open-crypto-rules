rules:
- id: c.openssl.algorithm.block-cipher.des
  message: Detected DES family block cipher usage
  mode: taint
  options:
    interfile: true
  severity: INFO
  languages:
  - c
  pattern-sources:
  - patterns:
    - pattern: $FUNC()
    - metavariable-regex:
        metavariable: $FUNC
        regex: ^EVP_(?<variant>des_cbc|des_ecb|des_cfb|des_ofb|des_ede|des_ede_cbc|des_ede3|des_ede3_cbc)$
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<variant>DES-CBC|DES-ECB|DES-CFB|DES-OFB|DES-EDE|DES-EDE-CBC|DES-EDE3|DES-EDE3-CBC|des-cbc|des-ecb|des-cfb|des-ofb|des-ede|des-ede-cbc|des-ede3|des-ede3-cbc)"'
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $API($ALGO)
      - pattern: $API($CTX, $ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: ^(?:EVP_get_cipherbyname|EVP_CipherInit_ex|EVP_EncryptInit_ex|EVP_DecryptInit_ex|EVP_CIPHER_fetch)$
    - focus-metavariable: $ALGO
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: block-cipher
      algorithmFamily: DES
      algorithmName: $variant
      library: OpenSSL
      api: $API
