rules:
  - id: c.openssl.algorithm.mac.hmac
    message: Detected HMAC message authentication code usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - pattern: $DIGEST

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $API($EVP_MD, ...)
              - pattern: $API($A, $B, $C, $EVP_MD, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^(HMAC|HMAC_Init_ex|HMAC_Init)$'
          - focus-metavariable: $EVP_MD

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: mac
        algorithmFamily: HMAC
        algorithmName: HMAC
        library: OpenSSL
        api: $API
