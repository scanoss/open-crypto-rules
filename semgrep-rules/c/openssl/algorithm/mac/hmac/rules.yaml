rules:
  - id: c.openssl.algorithm.mac.hmac
    message: Detected HMAC message authentication code usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - pattern: $DIGEST
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<variant>HMAC|hmac)"'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $API($EVP_MD, ...)
              - pattern: $API($A, $B, $C, $EVP_MD, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^(?:HMAC|HMAC_Init_ex|HMAC_Init)$'
          - focus-metavariable: $EVP_MD
      - patterns:
          - pattern: $API($A, $ALGO, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^EVP_MAC_fetch$'
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        operation: "tag"
        algorithmPrimitive: mac
        algorithmFamily: HMAC
        algorithmName: HMAC
        library: OpenSSL
        api: $API
  - id: c.openssl.algorithm.mac.hmac.generic
    message: Detected HMAC message authentication code name
    severity: INFO
    languages: [c]
    patterns:
      - pattern: $ALGO
      - metavariable-regex:
          metavariable: $ALGO
          regex: '"(?<variant>HMAC|hmac)"'
    metadata:
      category: security
      subcategory: cryptography
      confidence: MEDIUM
      crypto:
        assetType: algorithm
        algorithmPrimitive: mac
        algorithmFamily: HMAC
        algorithmName: HMAC
        library: OpenSSL
