rules:
  - id: c.openssl.algorithm.kem.ml-kem
    message: Detected ML-KEM post-quantum key encapsulation mechanism usage
    mode: taint
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<variant>id-alg-ml-kem-512|id-alg-ml-kem-768|id-alg-ml-kem-1024|ML-KEM-512|ML-KEM-768|ML-KEM-1024)"'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: EVP_PKEY_CTX_new_from_name($LIBCTX, $ALGO, $PROPQUERY)
              - pattern: EVP_PKEY_keygen_init($CTX)
              - pattern: EVP_PKEY_encapsulate_init($CTX, $PARAMS)
              - pattern: EVP_PKEY_encapsulate($CTX, $WRAPPEDKEY, $WRAPPEDKEYLEN, $SECRET, $SECRETLEN)
              - pattern: EVP_PKEY_decapsulate_init($CTX, $PARAMS)
              - pattern: EVP_PKEY_decapsulate($CTX, $SECRET, $SECRETLEN, $WRAPPEDKEY, $WRAPPEDKEYLEN)
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: kem
        algorithmFamily: ML-KEM
        algorithmName: $variant
        library: OpenSSL
        api: EVP_PKEY_CTX_new_from_name|EVP_PKEY_encapsulate|EVP_PKEY_decapsulate
