rules:
  - id: c.openssl.algorithm.kem.ml-kem
    message: Detected ML-KEM post-quantum key encapsulation mechanism usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c, cpp]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<variant>id-alg-ml-kem-(?<keysize>512|768|1024))"'
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<variant>ML-KEM-(?<keysize>512|768|1024))"'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $API($A, $ALGO, ...)
              - pattern: $API($A, $B, $ALGO, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^(?:EVP_PKEY_CTX_new_from_name|EVP_PKEY_Q_keygen|EVP_KEM_fetch)$'
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        operation: "encapsulate"
        algorithmPrimitive: kem
        algorithmFamily: ML-KEM
        algorithmName: ML-KEM-$keysize
        algorithmParameterSetIdentifier: $keysize
        library: OpenSSL
        api: $API
  - id: c.openssl.algorithm.kem.ml-kem.generic
    message: Detected ML-KEM post-quantum key encapsulation mechanism name
    severity: INFO
    languages: [c, cpp]
    patterns:
      - pattern: $ALGO
      - metavariable-regex:
          metavariable: $ALGO
          regex: '"(?<variant>(?:id-alg-ml-kem-|ML-KEM-)(?<keysize>512|768|1024))"'
    metadata:
      category: security
      subcategory: cryptography
      confidence: MEDIUM
      crypto:
        assetType: algorithm
        algorithmPrimitive: kem
        algorithmFamily: ML-KEM
        algorithmName: ML-KEM-$keysize
        algorithmParameterSetIdentifier: $keysize
        library: OpenSSL
