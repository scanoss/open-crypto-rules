rules:
  - id: c.openssl.algorithm.kdf.scrypt
    message: Detected scrypt key derivation function usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c, cpp]

    pattern-sources:
      - pattern: $FUNC
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<variant>SCRYPT|scrypt)"'

    pattern-sinks:
      - patterns:
          - pattern: $API($PASSWORD, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^EVP_PBE_scrypt$'
          - focus-metavariable: $PASSWORD
      - patterns:
          - pattern: $API($A, $ALGO, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^EVP_KDF_fetch$'
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        operation: "keyderive"
        algorithmPrimitive: kdf
        algorithmFamily: scrypt
        algorithmName: scrypt
        library: OpenSSL
        api: $API
  - id: c.openssl.algorithm.kdf.scrypt.generic
    message: Detected scrypt key derivation function name
    severity: INFO
    languages: [c, cpp]
    patterns:
      - pattern: $ALGO
      - metavariable-regex:
          metavariable: $ALGO
          regex: '"(?<variant>SCRYPT|scrypt)"'
    metadata:
      category: security
      subcategory: cryptography
      confidence: MEDIUM
      crypto:
        assetType: algorithm
        algorithmPrimitive: kdf
        algorithmFamily: scrypt
        algorithmName: scrypt
        library: OpenSSL
