rules:
  - id: c.openssl.algorithm.kdf.scrypt
    message: Detected scrypt key derivation function usage
    mode: taint
    severity: INFO
    languages: [c]

    pattern-sources:
      - pattern: $FUNC
      - pattern: '"scrypt"'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: EVP_PBE_scrypt($PASSWORD, $PLEN, $SALT, $SLEN, $N, $R, $P, $MAXMEM, $KEY, $KEY_LENGTH)
              - pattern: EVP_KDF_CTX_set_params($CTX, $PARAMS)
          - focus-metavariable: $PASSWORD

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: kdf
        algorithmFamily: scrypt
        algorithmName: scrypt
        library: OpenSSL
        api: EVP_PBE_scrypt|EVP_KDF_CTX_set_params
