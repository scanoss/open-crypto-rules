rules:
  - id: c.openssl.algorithm.kdf.scrypt
    message: Detected scrypt key derivation function usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - pattern: $FUNC
      - pattern: '"scrypt"'

    pattern-sinks:
      - patterns:
          - pattern: $API($PASSWORD, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^EVP_PBE_scrypt$'
          - focus-metavariable: $PASSWORD

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: kdf
        algorithmFamily: scrypt
        algorithmName: scrypt
        library: OpenSSL
        api: $API
