rules:
  - id: c.openssl.algorithm.kdf.pbkdf2
    message: Detected PBKDF2 key derivation function usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - pattern: $DIGEST

    pattern-sinks:
      - patterns:
          - pattern: $API($A, $B, $C, $D, $E, $DIGEST, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^PKCS5_PBKDF2_HMAC$'
          - focus-metavariable: $DIGEST

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: kdf
        algorithmFamily: PBKDF2
        algorithmName: PBKDF2
        library: OpenSSL
        api: $API
