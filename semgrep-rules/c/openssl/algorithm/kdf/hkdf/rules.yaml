rules:
  - id: c.openssl.algorithm.kdf.hkdf
    message: Detected HKDF key derivation function usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - pattern: $DIGEST

    pattern-sinks:
      - patterns:
          - pattern: $API($A, $B, $DIGEST, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^(HKDF|HKDF_extract|HKDF_expand)$'
          - focus-metavariable: $DIGEST

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: kdf
        algorithmFamily: HKDF
        algorithmName: HKDF
        library: OpenSSL
        api: $API
