rules:
  - id: c.openssl.algorithm.hash.sha-1
    message: Detected SHA-1 hash function usage
    mode: taint
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<algorithmname>SHA1|SHA-1|RSA-SHA1|sha1WithRSAEncryption|ssl3-sha1|SSL3-SHA1|dsaWithSHA1|DSA-SHA1|ecdsa-with-SHA1)"'
      - pattern: EVP_sha1()

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: EVP_Q_digest($CTX, $IN, $INLEN, $OUT, $OUTLEN, $NAME, $ALGO, $PARAMS)
              - pattern: EVP_get_digestbyname($ALGO)
              - pattern: EVP_DigestInit_ex($CTX, $ALGO, $ENGINE)
              - pattern: EVP_DigestInit_ex2($CTX, $ALGO, $PARAMS)
              - pattern: EVP_MD_fetch($CTX, $ALGO, $PROPS)
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: hash
        algorithmFamily: SHA-1
        algorithmName: SHA-1
        algorithmParameterSetIdentifier: "160"
        library: OpenSSL
        oid: 1.3.14.3.2.26
        api: EVP_get_digestbyname|EVP_Q_digest|EVP_DigestInit_ex|EVP_sha1
