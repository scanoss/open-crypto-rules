rules:
  - id: c.openssl.algorithm.hash.whirlpool
    message: Detected Whirlpool hash function usage
    mode: taint
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<algorithmname>whirlpool|WHIRLPOOL)"'
      - pattern: EVP_whirlpool()

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: EVP_Q_digest($CTX, $IN, $INLEN, $OUT, $OUTLEN, $NAME, $ALGO, $PARAMS)
              - pattern: EVP_get_digestbyname($ALGO)
              - pattern: EVP_DigestInit_ex($CTX, $ALGO, $ENGINE)
              - pattern: EVP_DigestInit_ex2($CTX, $ALGO, $PARAMS)
              - pattern: EVP_MD_fetch($CTX, $ALGO, $PROPS)
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: hash
        algorithmFamily: Whirlpool
        algorithmName: Whirlpool
        algorithmParameterSetIdentifier: "512"
        library: OpenSSL
        oid: 1.0.10118.3.0.55
        api: EVP_get_digestbyname|EVP_Q_digest|EVP_DigestInit_ex|EVP_whirlpool
