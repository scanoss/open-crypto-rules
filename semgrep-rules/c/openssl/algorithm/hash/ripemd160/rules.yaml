rules:
- id: c.openssl.algorithm.hash.ripemd160
  message: Detected RIPEMD160 hash function usage
  mode: taint
  options:
    interfile: true
  severity: INFO
  languages:
  - c
  pattern-sources:
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<algorithmname>RIPEMD160|RMD160|ripemd160WithRSA)"'
  - pattern: EVP_ripemd160()
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $API($ALGO)
      - pattern: $API($CTX, $ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: ^(?:EVP_get_digestbyname|EVP_Q_digest|EVP_DigestInit_ex2?|EVP_MD_fetch)$
    - focus-metavariable: $ALGO
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: hash
      algorithmFamily: RIPEMD
      algorithmName: RIPEMD160
      algorithmParameterSetIdentifier: '160'
      library: OpenSSL
      oid: 1.3.36.3.2.1
      api: $API
