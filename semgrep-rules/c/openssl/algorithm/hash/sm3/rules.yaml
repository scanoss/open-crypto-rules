rules:
  - id: c.openssl.algorithm.hash.sm3
    message: Detected SM3 hash function usage
    mode: taint
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<algorithmname>SM3|sm3)"'
      - pattern: EVP_sm3()

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: EVP_Q_digest($CTX, $IN, $INLEN, $OUT, $OUTLEN, $NAME, $ALGO, $PARAMS)
              - pattern: EVP_get_digestbyname($ALGO)
              - pattern: EVP_DigestInit_ex($CTX, $ALGO, $ENGINE)
              - pattern: EVP_DigestInit_ex2($CTX, $ALGO, $PARAMS)
              - pattern: EVP_MD_fetch($CTX, $ALGO, $PROPS)
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: hash
        algorithmFamily: SM3
        algorithmName: SM3
        algorithmParameterSetIdentifier: "256"
        library: OpenSSL
        oid: 1.2.156.10197.1.401
        api: EVP_get_digestbyname|EVP_Q_digest|EVP_DigestInit_ex|EVP_sm3
