rules:
  - id: c.openssl.algorithm.hash.blake2
    message: Detected BLAKE2 hash function usage
    mode: taint
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<variant>BLAKE2b512|BLAKE2s256)"'
      - pattern-either:
          - pattern: EVP_blake2b512()
          - pattern: EVP_blake2s256()

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: EVP_Q_digest($CTX, $IN, $INLEN, $OUT, $OUTLEN, $NAME, $ALGO, $PARAMS)
              - pattern: EVP_get_digestbyname($ALGO)
              - pattern: EVP_DigestInit_ex($CTX, $ALGO, $ENGINE)
              - pattern: EVP_DigestInit_ex2($CTX, $ALGO, $PARAMS)
              - pattern: EVP_MD_fetch($CTX, $ALGO, $PROPS)
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: hash
        algorithmFamily: BLAKE2
        algorithmName: BLAKE2-$variant
        library: OpenSSL
        api: EVP_get_digestbyname|EVP_Q_digest|EVP_DigestInit_ex|EVP_blake2*
