rules:
- id: c.openssl.algorithm.hash.shake
  message: Detected SHAKE extendable output function usage
  mode: taint
  options:
    interfile: true
  severity: INFO
  languages:
  - c
  pattern-sources:
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<variant>SHAKE-?128|SHAKE-?256)"'
  - pattern-either:
    - pattern: EVP_shake128()
    - pattern: EVP_shake256()
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $API($ALGO)
      - pattern: $API($CTX, $ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: ^(?:EVP_get_digestbyname|EVP_Q_digest|EVP_DigestInit_ex2?|EVP_MD_fetch)$
    - focus-metavariable: $ALGO
  - patterns:
    - pattern: EVP_Digest($DATA, $LEN, $MD, $MDLEN, $ALGO, ...)
    - focus-metavariable: $ALGO
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      operation: "digest"
      algorithmPrimitive: xof
      algorithmFamily: SHAKE
      algorithmName: $variant
      library: OpenSSL
      api: $API
- id: c.openssl.algorithm.hash.shake.generic
  message: Detected SHAKE extendable output function name
  severity: INFO
  languages:
  - c
  patterns:
  - pattern: $ALGO
  - metavariable-regex:
      metavariable: $ALGO
      regex: '"(?<variant>SHAKE-?128|SHAKE-?256)"'
  metadata:
    category: security
    subcategory: cryptography
    confidence: MEDIUM
    crypto:
      assetType: algorithm
      algorithmPrimitive: xof
      algorithmFamily: SHAKE
      algorithmName: $variant
      library: OpenSSL
