rules:
- id: c.openssl.algorithm.signature.rsa-pkcs1
  message: Detected RSA-PKCS1 signature algorithm usage
  mode: taint
  options:
    interfile: true
  severity: INFO
  languages:
  - c
  pattern-sources:
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<variant>rsaEncryption|RSA|rsa)"'
  - pattern: EVP_PKEY_RSA
  pattern-sinks:
  - &id001
    patterns:
    - pattern: $API($ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: ^EVP_PKEY_CTX_new_id$
    - focus-metavariable: $ALGO
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: signature
      algorithmFamily: RSASSA-PKCS1
      algorithmName: RSA-PKCS1
      library: OpenSSL
      oid: 1.2.840.113549.1.1.1
      api: $API
- id: c.openssl.algorithm.signature.rsa-pss
  message: Detected RSA-PSS signature algorithm usage
  mode: taint
  options:
    interfile: true
  severity: INFO
  languages:
  - c
  pattern-sources:
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<variant>rsassaPss|RSA-PSS|rsa-pss)"'
  - pattern: EVP_PKEY_RSA_PSS
  pattern-sinks:
  - *id001
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: signature
      algorithmFamily: RSASSA-PSS
      algorithmName: RSA-PSS
      library: OpenSSL
      oid: 1.2.840.113549.1.1.10
      api: $API
