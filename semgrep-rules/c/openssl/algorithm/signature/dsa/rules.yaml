rules:
- id: c.openssl.algorithm.signature.dsa
  message: Detected DSA signature algorithm usage
  mode: taint
  options:
    interfile: true
  severity: INFO
  languages:
  - c
  - cpp
  pattern-sources:
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<variant>dsaEncryption|DSA|dsa)"'
  - pattern: EVP_PKEY_DSA
  pattern-sinks:
  - patterns:
    - pattern: $API($ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: ^EVP_PKEY_CTX_new_id$
    - focus-metavariable: $ALGO
  - patterns:
    - pattern-either:
      - pattern: $API($A, $ALGO, ...)
      - pattern: $API($A, $B, $ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: '^(?:EVP_PKEY_CTX_new_from_name|EVP_PKEY_Q_keygen)$'
    - focus-metavariable: $ALGO
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: signature
      algorithmFamily: DSA
      algorithmName: DSA
      library: OpenSSL
      oid: 1.2.840.10040.4.1
      api: $API
- id: c.openssl.algorithm.signature.dsa.generic
  message: Detected DSA signature algorithm name
  severity: INFO
  languages:
  - c
  - cpp
  patterns:
  - pattern: $ALGO
  - metavariable-regex:
      metavariable: $ALGO
      regex: '"(?<variant>dsaEncryption|DSA|dsa)"'
  metadata:
    category: security
    subcategory: cryptography
    confidence: MEDIUM
    crypto:
      assetType: algorithm
      algorithmPrimitive: signature
      algorithmFamily: DSA
      algorithmName: DSA
      library: OpenSSL
      oid: 1.2.840.10040.4.1
