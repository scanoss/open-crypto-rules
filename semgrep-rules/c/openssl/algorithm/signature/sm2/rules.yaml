rules:
  - id: c.openssl.algorithm.signature.sm2
    message: Detected SM2 signature algorithm usage
    mode: taint
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<variant>SM2|sm2)"'
      - pattern: EVP_PKEY_SM2

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: EVP_PKEY_CTX_new_id($ALGO, $ENGINE)
              - pattern: EVP_PKEY_keygen_init($CTX)
              - pattern: EVP_PKEY_sign_init($CTX)
              - pattern: EVP_PKEY_verify_init($CTX)
              - pattern: EVP_DigestSignInit($CTX, $PCTX, $MD, $ENGINE, $PKEY)
              - pattern: EVP_DigestVerifyInit($CTX, $PCTX, $MD, $ENGINE, $PKEY)
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: signature
        algorithmFamily: SM2
        algorithmName: SM2
        library: OpenSSL
        oid: 1.2.156.10197.1.301
        api: EVP_PKEY_CTX_new_id|EVP_PKEY_sign_init|EVP_DigestSignInit
