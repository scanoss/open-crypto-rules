rules:
- id: c.openssl.algorithm.signature.sm2
  message: Detected SM2 signature algorithm usage
  mode: taint
  options:
    interfile: true
  severity: INFO
  languages:
  - c
  pattern-sources:
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<variant>SM2|sm2)"'
  - pattern: EVP_PKEY_SM2
  pattern-sinks:
  - patterns:
    - pattern: $API($ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: ^EVP_PKEY_CTX_new_id$
    - focus-metavariable: $ALGO
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: signature
      algorithmFamily: SM2
      algorithmName: SM2
      library: OpenSSL
      oid: 1.2.156.10197.1.301
      api: $API
