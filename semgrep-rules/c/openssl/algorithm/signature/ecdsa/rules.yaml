rules:
- id: c.openssl.algorithm.signature.ecdsa
  message: Detected ECDSA signature algorithm usage
  mode: taint
  severity: INFO
  languages:
  - c
  - cpp
  pattern-sources:
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<variant>id-ecPublicKey|EC|ec|ecdsa)"'
  - pattern: EVP_PKEY_EC
  pattern-sinks:
  - patterns:
    - pattern: $API($ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: ^EVP_PKEY_CTX_new_id$
    - focus-metavariable: $ALGO
  - patterns:
    - pattern-either:
      - pattern: $API($A, $ALGO, ...)
      - pattern: $API($A, $B, $ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: '^(?:EVP_PKEY_CTX_new_from_name|EVP_PKEY_Q_keygen)$'
    - focus-metavariable: $ALGO
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: signature
      algorithmFamily: ECDSA
      algorithmName: ECDSA
      library: OpenSSL
      oid: 1.2.840.10045.2.1
      api: $API
- id: c.openssl.algorithm.signature.ecdsa.low-level
  message: Detected low-level ECDSA signature operations
  severity: INFO
  languages:
  - c
  - cpp
  patterns:
  - pattern: $API(...)
  - metavariable-regex:
      metavariable: $API
      regex: ^(?:ECDSA_SIG_new|ECDSA_SIG_set0|ECDSA_SIG_get0|d2i_ECDSA_SIG|i2d_ECDSA_SIG)$
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: signature
      algorithmFamily: ECDSA
      algorithmName: ECDSA
      library: OpenSSL
      oid: 1.2.840.10045.2.1
      api: $API
- id: c.openssl.algorithm.signature.ecdsa.generic
  message: Detected ECDSA signature algorithm name
  severity: INFO
  languages:
  - c
  - cpp
  patterns:
  - pattern: $ALGO
  - metavariable-regex:
      metavariable: $ALGO
      regex: '"(?<variant>id-ecPublicKey|EC|ec|ecdsa)"'
  metadata:
    category: security
    subcategory: cryptography
    confidence: MEDIUM
    crypto:
      assetType: algorithm
      algorithmPrimitive: signature
      algorithmFamily: ECDSA
      algorithmName: ECDSA
      library: OpenSSL
      oid: 1.2.840.10045.2.1
