rules:
  - id: c.openssl.algorithm.signature.ml-dsa
    message: Detected ML-DSA post-quantum signature algorithm usage
    mode: taint
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '"(?<variant>id-ml-dsa-44|id-ml-dsa-65|id-ml-dsa-87|ML-DSA-44|ML-DSA-65|ML-DSA-87)"'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: EVP_PKEY_CTX_new_from_name($LIBCTX, $ALGO, $PROPQUERY)
              - pattern: EVP_PKEY_keygen_init($CTX)
              - pattern: EVP_PKEY_sign_init($CTX)
              - pattern: EVP_PKEY_verify_init($CTX)
              - pattern: EVP_DigestSignInit($CTX, $PCTX, $MD, $ENGINE, $PKEY)
              - pattern: EVP_DigestVerifyInit($CTX, $PCTX, $MD, $ENGINE, $PKEY)
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: signature
        algorithmFamily: ML-DSA
        algorithmName: $variant
        library: OpenSSL
        api: EVP_PKEY_CTX_new_from_name|EVP_PKEY_sign_init|EVP_DigestSignInit
