rules:
- id: c.openssl.algorithm.signature.eddsa
  message: Detected EdDSA signature algorithm usage
  mode: taint
  options:
    interfile: true
  severity: INFO
  languages:
  - c
  pattern-sources:
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<variant>ED25519|ED448|ed25519|ed448)"'
  - pattern-either:
    - pattern: EVP_PKEY_ED25519
    - pattern: EVP_PKEY_ED448
  pattern-sinks:
  - patterns:
    - pattern: $API($ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: ^EVP_PKEY_CTX_new_id$
    - focus-metavariable: $ALGO
  - patterns:
    - pattern-either:
      - pattern: $API($A, $ALGO, ...)
      - pattern: $API($A, $B, $ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: '^(?:EVP_PKEY_CTX_new_from_name|EVP_PKEY_Q_keygen)$'
    - focus-metavariable: $ALGO
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: signature
      algorithmFamily: EdDSA
      algorithmName: $variant
      library: OpenSSL
      api: $API
- id: c.openssl.algorithm.signature.eddsa.generic
  message: Detected EdDSA signature algorithm name
  severity: INFO
  languages:
  - c
  patterns:
  - pattern: $ALGO
  - metavariable-regex:
      metavariable: $ALGO
      regex: '"(?<variant>ED25519|ED448|ed25519|ed448)"'
  metadata:
    category: security
    subcategory: cryptography
    confidence: MEDIUM
    crypto:
      assetType: algorithm
      algorithmPrimitive: signature
      algorithmFamily: EdDSA
      algorithmName: $variant
      library: OpenSSL
