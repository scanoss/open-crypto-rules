rules:
  - id: c.openssl.algorithm.drbg.rand
    message: Detected OpenSSL random number generation
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - pattern: $SIZE
      - pattern: RAND_bytes
      - pattern: RAND_priv_bytes

    pattern-sinks:
      - patterns:
          - pattern: $API($BUFFER, $SIZE)
          - metavariable-regex:
              metavariable: $API
              regex: '^(RAND_bytes|RAND_priv_bytes)$'
          - focus-metavariable: $BUFFER

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: drbg
        algorithmFamily: DRBG
        algorithmName: OpenSSL-RAND
        library: OpenSSL
        api: $API
