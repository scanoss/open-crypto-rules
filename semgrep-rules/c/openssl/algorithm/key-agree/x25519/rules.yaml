rules:
- id: c.openssl.algorithm.key-agree.x25519
  message: Detected X25519 key agreement usage
  mode: taint
  options:
    interfile: true
  severity: INFO
  languages:
  - c
  pattern-sources:
  - patterns:
    - pattern: $ALGO
    - metavariable-regex:
        metavariable: $ALGO
        regex: '"(?<variant>X25519|x25519)"'
  - pattern: EVP_PKEY_X25519
  pattern-sinks:
  - patterns:
    - pattern: $API($ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: ^EVP_PKEY_CTX_new_id$
    - focus-metavariable: $ALGO
  - patterns:
    - pattern-either:
      - pattern: $API($A, $ALGO, ...)
      - pattern: $API($A, $B, $ALGO, ...)
    - metavariable-regex:
        metavariable: $API
        regex: '^(?:EVP_PKEY_CTX_new_from_name|EVP_PKEY_Q_keygen)$'
    - focus-metavariable: $ALGO
  metadata:
    category: security
    subcategory: cryptography
    confidence: HIGH
    crypto:
      assetType: algorithm
      algorithmPrimitive: key-agree
      algorithmFamily: X25519
      algorithmName: X25519
      library: OpenSSL
      oid: 1.3.101.110
      api: $API
- id: c.openssl.algorithm.key-agree.x25519.generic
  message: Detected X25519 key agreement algorithm name
  severity: INFO
  languages:
  - c
  patterns:
  - pattern: $ALGO
  - metavariable-regex:
      metavariable: $ALGO
      regex: '"(?<variant>X25519|x25519)"'
  metadata:
    category: security
    subcategory: cryptography
    confidence: MEDIUM
    crypto:
      assetType: algorithm
      algorithmPrimitive: key-agree
      algorithmFamily: X25519
      algorithmName: X25519
      library: OpenSSL
      oid: 1.3.101.110
