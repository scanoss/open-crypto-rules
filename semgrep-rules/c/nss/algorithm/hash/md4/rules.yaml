rules:
  - id: c.nss.algorithm.hash.md4
    message: Detected MD4 hash function usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]
    pattern-sources:
      - patterns:
          - pattern: $MECH
          - metavariable-regex:
              metavariable: $MECH
              regex: '^SEC_OID_MD4$'
    pattern-sinks:
      - patterns:
          - pattern: $API($MECH)
          - metavariable-regex:
              metavariable: $API
              regex: '^PK11_CreateDigestContext$'
          - focus-metavariable: $MECH
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: hash
        algorithmFamily: MD4
        algorithmName: MD4
        algorithmParameterSetIdentifier: "128"
        library: NSS
        api: $API
