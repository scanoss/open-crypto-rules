rules:
  - id: c.nss.algorithm.hash.md5
    message: Detected MD5 hash function usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c, cpp]

    pattern-sources:
      - patterns:
          - pattern: $MECH
          - metavariable-regex:
              metavariable: $MECH
              regex: '^SEC_OID_MD5$'

    pattern-sinks:
      - patterns:
          - pattern: $API($MECH)
          - metavariable-regex:
              metavariable: $API
              regex: '^PK11_CreateDigestContext$'
          - focus-metavariable: $MECH

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        operation: "digest"
        algorithmPrimitive: hash
        algorithmFamily: MD5
        algorithmName: MD5
        algorithmParameterSetIdentifier: "128"
        library: NSS
        api: $API
