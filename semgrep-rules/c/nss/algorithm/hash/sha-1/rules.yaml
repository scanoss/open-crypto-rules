rules:
  - id: c.nss.algorithm.hash.sha-1
    message: Detected SHA-1 hash function usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $MECH
          - metavariable-regex:
              metavariable: $MECH
              regex: '^SEC_OID_SHA1$'

    pattern-sinks:
      - patterns:
          - pattern: $API($MECH)
          - metavariable-regex:
              metavariable: $API
              regex: '^PK11_CreateDigestContext$'
          - focus-metavariable: $MECH

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: hash
        algorithmFamily: SHA-1
        algorithmName: SHA-1
        algorithmParameterSetIdentifier: "160"
        library: NSS
        api: $API
