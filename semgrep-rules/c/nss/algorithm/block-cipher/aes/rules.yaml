rules:
  - id: c.nss.algorithm.block-cipher.aes
    message: Detected AES block cipher usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $MECH
          - metavariable-regex:
              metavariable: $MECH
              regex: '^CKM_AES_.*$'

    pattern-sinks:
      - patterns:
          - pattern: $API($A, $MECH, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^(PK11_CreateContext|PK11_Encrypt|PK11_Decrypt)$'
          - focus-metavariable: $MECH

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: block-cipher
        algorithmFamily: AES
        algorithmName: AES
        library: NSS
        api: $API
