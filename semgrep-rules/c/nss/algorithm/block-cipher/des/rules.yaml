rules:
  - id: c.nss.algorithm.block-cipher.des
    message: Detected DES family block cipher usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $MECH
          - metavariable-regex:
              metavariable: $MECH
              regex: '^CKM_(DES|DES2|DES3).*$'

    pattern-sinks:
      - patterns:
          - pattern: $API($A, $MECH, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^(PK11_CreateContext|PK11_Encrypt|PK11_Decrypt)$'
          - focus-metavariable: $MECH

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: block-cipher
        algorithmFamily: DES
        algorithmName: DES
        library: NSS
        api: $API
