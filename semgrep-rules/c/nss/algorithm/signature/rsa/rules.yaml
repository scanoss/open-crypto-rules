rules:
  - id: c.nss.algorithm.signature.rsa
    message: Detected RSA signature algorithm usage
    mode: taint
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $MECH
          - metavariable-regex:
              metavariable: $MECH
              regex: '^CKM_RSA_.*$'
      - pattern: SECKEY_CreateRSAPrivateKey($KEYSIZE, ...)

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: PK11_GenerateKeyPair($_, $MECH, ...)
              - pattern: PK11_Sign($KEY, $SIG, ...)
              - pattern: PK11_Verify($KEY, $SIG, ...)
          - focus-metavariable: $MECH

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: signature
        algorithmFamily: RSASSA-PKCS1
        algorithmName: RSA
        library: NSS
        api: PK11_GenerateKeyPair|PK11_Sign|PK11_Verify
