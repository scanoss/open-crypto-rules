rules:
  - id: c.nss.algorithm.signature.rsa
    message: Detected RSA signature algorithm usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $MECH
          - metavariable-regex:
              metavariable: $MECH
              regex: '^CKM_RSA_.*$'
      - pattern: SECKEY_CreateRSAPrivateKey($KEYSIZE, ...)

    pattern-sinks:
      - patterns:
          - pattern: $API($A, $MECH, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^PK11_GenerateKeyPair$'
          - focus-metavariable: $MECH

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: signature
        algorithmFamily: RSASSA-PKCS1
        algorithmName: RSA
        library: NSS
        api: $API
