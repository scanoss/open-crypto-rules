rules:
  - id: c.nss.algorithm.signature.dsa
    message: Detected DSA signature algorithm usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c, cpp]

    pattern-sources:
      - patterns:
          - pattern: $MECH
          - metavariable-regex:
              metavariable: $MECH
              regex: '^CKM_DSA.*$'
      - pattern: SECKEY_CreateDSAPrivateKey(...)

    pattern-sinks:
      - patterns:
          - pattern: $API($A, $MECH, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^PK11_GenerateKeyPair$'
          - focus-metavariable: $MECH

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        algorithmPrimitive: signature
        algorithmFamily: DSA
        algorithmName: DSA
        library: NSS
        api: $API
