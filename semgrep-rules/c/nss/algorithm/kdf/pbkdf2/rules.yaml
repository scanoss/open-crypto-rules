rules:
  - id: c.nss.algorithm.kdf.pbkdf2
    message: Detected PBKDF2 key derivation function usage
    mode: taint
    options:
      interfile: true
    severity: INFO
    languages: [c]

    pattern-sources:
      - patterns:
          - pattern: $MECH
          - metavariable-regex:
              metavariable: $MECH
              regex: '^CKM_PKCS5_PBKD2.*$'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $API($MECH, ...)
              - pattern: $API($A, $B, $C, $D, $E, $MECH, ...)
          - metavariable-regex:
              metavariable: $API
              regex: '^(PK11_CreatePBEV2AlgorithmID|PK11_PBEKeyGen)$'
          - focus-metavariable: $MECH

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        operation: "keyderive"
        algorithmPrimitive: kdf
        algorithmFamily: PBKDF2
        algorithmName: PBKDF2
        library: NSS
        api: $API
