# RSA signing and verification through the Node.js crypto Sign / Verify methods
# update(), sign(), verify() and the one-shot crypto.sign() / crypto.verify();
# public-key encryption through crypto.{public,private}{Encrypt,Decrypt}.
#
# The six sign/verify rules taint the algorithm string - only the signature
# scheme names name RSA outright, a bare digest ('sha256') leaving the scheme to
# the key. The four -pss and two -oaep rules taint the padding constant instead
# and accept any algorithm argument, including the null the docs pass; they carry
# the only algorithmName here, the padding being all that separates them from the
# rule beside them, which matches PSS calls too and so stays silent on the scheme
# (a call naming both is reported twice). The four base pke rules taint nothing:
# each reaches EVP_PKEY_CTX_set_rsa_padding(), which fails for a non-RSA key.
#
# Class sinks match all four ways to get a Sign or a Verify - factory and
# exported constructor, with and without new - inside a deep-expression operator
# absorbing the chainable methods. Every rule is gated on an import of node's
# crypto, the qualified spellings also binding the receiver to its alias; the
# gate does not prove the library, since bundlers alias the bare 'crypto'
# specifier to crypto-browserify, which exposes these APIs under these names.
#
# Accepted by the six sign/verify rules, case-insensitively:
#   RSA-{MD5,SHA1,SHA224,SHA256,SHA384,SHA512,SHA3-{224,256,384,512}}
#
# Not covered: the long-name aliases of those NIDs ({md4,md5,sha1,sha224,sha256,
# sha384,sha512,sha512-224,sha512-256,sm3}WithRSAEncryption,
# {ripemd160,mdc2}WithRSA, id-rsassa-pkcs1-v1_5-with-sha3-*);
# RSA-{MD4,SHA1-2,SHA512/224,SHA512/256,RIPEMD160,MDC2,SM3}; RSA-{MD2,NP-MD5,SHA}
# and sha1WithRSA, which no registered digest points at; dotted-decimal OIDs; the
# digest each name also identifies, a separate CycloneDX hash component; the key
# size, and the padding on calls not naming the constant; the stream interface
# alone; and four import spellings - inline require("crypto").publicEncrypt(), a
# renamed named import in ESM or CJS (plain ones resolve), await import().

rules:
  - id: javascript.crypto.rsa.sign-update
    message: Detected RSA signing via Node.js crypto Sign update
    severity: INFO
    mode: taint
    languages: [javascript, typescript]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '(?i)^["'']RSA-(?:MD5|SHA1|SHA(?:3-)?(?:224|256|384|512))["'']$'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $C = require($MOD)
                          ...
                      - pattern-inside: |
                          import $C from $MOD
                          ...
                      - pattern-inside: |
                          import * as $C from $MOD
                          ...
                  - pattern-either:
                      - pattern: |
                          $CTX = <... $C.$MAKE($ALGO, ...) ...>
                          ...
                          <... $CTX ...>.update(...)
                      - pattern: |
                          $CTX = <... new $C.$MAKE($ALGO, ...) ...>
                          ...
                          <... $CTX ...>.update(...)
                      - pattern: <... $C.$MAKE($ALGO, ...) ...>.update(...)
                      - pattern: <... new $C.$MAKE($ALGO, ...) ...>.update(...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $C = require($MOD)
                          ...
                      - pattern-inside: |
                          import {...} from $MOD
                          ...
                  - pattern-either:
                      - pattern: |
                          $CTX = <... $MAKE($ALGO, ...) ...>
                          ...
                          <... $CTX ...>.update(...)
                      - pattern: |
                          $CTX = <... new $MAKE($ALGO, ...) ...>
                          ...
                          <... $CTX ...>.update(...)
                      - pattern: <... $MAKE($ALGO, ...) ...>.update(...)
                      - pattern: <... new $MAKE($ALGO, ...) ...>.update(...)
          - metavariable-regex:
              metavariable: $MOD
              regex: '^["'']?(?:node:)?crypto["'']?$'
          - metavariable-regex:
              metavariable: $MAKE
              regex: '^(?:createSign|Sign)$'
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#class-sign
        - https://nodejs.org/api/crypto.html#cryptocreatesignalgorithm-options
