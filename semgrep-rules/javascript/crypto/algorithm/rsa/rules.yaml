              - pattern: |
                  $SIGN = <... new $MAKE($ALGO, ...) ...>
                  ...
                  <... $SIGN ...>.sign({..., padding: $PAD}, ...)
              - pattern: '<... $CRYPTO.$MAKE($ALGO, ...) ...>.sign({..., padding: $PAD}, ...)'
              - pattern: '<... $MAKE($ALGO, ...) ...>.sign({..., padding: $PAD}, ...)'
              - pattern: '<... new $CRYPTO.$MAKE($ALGO, ...) ...>.sign({..., padding: $PAD}, ...)'
              - pattern: '<... new $MAKE($ALGO, ...) ...>.sign({..., padding: $PAD}, ...)'
          - metavariable-regex:
              metavariable: $MAKE
              regex: '^(?:createSign|Sign)$'
          - focus-metavariable: $PAD

    metadata:
      category: security
