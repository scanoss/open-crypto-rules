# RSA signing and verification through the Node.js crypto Sign and Verify
# instance methods update(), sign() and verify(), and through the one-shot module
# functions crypto.sign() and crypto.verify(). Every entry point names a digest;
# for most spellings ('sha256') the signature algorithm comes from the key and
# could equally be EC or DSA, so those are not sources - the algorithm would be a
# guess. Only the OpenSSL signature-scheme names name RSA outright. They resolve
# because EVP_add_digest() registers each digest's pkey_type short and long name
# as aliases of the digest, and every digest carrying a pkey_type pairs it with
# RSA.
#
# Class sinks match all four ways to get a Sign or a Verify - the factory and the
# exported constructor, each with and without new, which self-instantiates -
# inside a deep-expression operator to absorb the chainable this-returning
# methods and pipe(). Neither class has a copy(), so there is no second-instance
# producer. One-shot sinks match the module-qualified and destructured spellings.
#
# parameterCondition anchors to param[0] of createSign()/createVerify() for the
# class rules, not of the detected call, and to param[0] of the detected call for
# the one-shots; for the -pss rules, to the padding property of param[0] of
# sign()/verify() (class) or of param[2], the key argument (one-shot).
#
# Accepted by every rule but the four -pss ones, case-insensitively (the OBJ_NAME
# table compares with OPENSSL_strcasecmp, so RSA-SHA256 and rsa-sha256 both
# resolve) - the short name of each pair, which is the canonical one:
#   RSA-{MD5,SHA1,SHA224,SHA256,SHA384,SHA512,SHA3-{224,256,384,512}}
#
# Not covered: the long-name aliases of those same NIDs -
# {md4,md5,sha1,sha224,sha256,sha384,sha512,sha512-224,sha512-256,sm3}WithRSA-
# Encryption, {ripemd160,mdc2}WithRSA, and id-rsassa-pkcs1-v1_5-with-sha3-*
# (the one pair registered the other way round), each a second alternation arm
# for a name the short form already covers; RSA-{MD4,SHA1-2,SHA512/224,
# SHA512/256,RIPEMD160,MDC2,SM3}; RSA-{MD2,NP-MD5,SHA} and sha1WithRSA, which no
# registered digest points at; the digest each name also identifies - CycloneDX
# models it as a separate hash component; algorithmParameterSetIdentifier, a
# property of the key; padding on the non-pss rules, which the signing call can
# override, hence -pss; a null or undefined algorithm on the one-shots, where the
# key type alone decides; signing or verifying through the stream interface
# alone; dotted-decimal OIDs.
#
# RSA public-key encryption through the four module functions
# crypto.{publicEncrypt,privateEncrypt,publicDecrypt,privateDecrypt}. The docs
# state no key-type restriction, but all four are RSA-only in practice: each
# routes through ncrypto's RSA_Cipher/CipherImpl, which calls
# EVP_PKEY_CTX_set_rsa_padding() unconditionally, and that control op returns -2
# for any non-RSA key. Checked on v22 - rsa-pss, ec, x25519, ed25519 and SM2 all
# throw. So the API names the algorithm and there is no string to match: the
# base rules are plain patterns, carrying no parameterCondition.
#
# Because nothing else in these six rules narrows them, every one is gated on the
# file importing node's crypto: a pattern-inside pairing the import with the call,
# over require($MOD), import $C from $MOD, import * as $C from $MOD and
# import {...} from $MOD, with $MOD accepting crypto and node:crypto ($MOD binds
# quoted under require and bare under import, hence the optional quotes in the
# regex). The qualified spellings additionally bind the receiver to the imported
# alias, so a same-named method on any other object - a wrapper class's own
# publicEncrypt(), node-forge - does not match; the bare spellings, reached by a
# destructured require or a named import, are gated on the import alone.
#
# OAEP is legal only in publicEncrypt() and privateDecrypt(), where it is also
# the default; the other two take RSA_PKCS1_PADDING (their default) or
# RSA_NO_PADDING. The two -oaep rules are taint rules on an explicit
# RSA_PKCS1_OAEP_PADDING, with parameterCondition anchored to the padding
# property of param[0], the key argument. As with -pss they are additive: a call
# naming the constant reports both RSA and RSA-OAEP.
#
# Not covered by the four pke rules: the OAEP default, applying whenever the key
# argument carries no padding property - claiming it would mean claiming it for
# an options object reached through a variable too, and over-claiming a padding
# is worse than omitting one; RSA_PKCS1_PADDING and RSA_NO_PADDING, reported as
# plain RSA by the base rules; {oaep,mgf1}Hash and oaepLabel, the OAEP digest
# being a separate CycloneDX hash component; algorithmParameterSetIdentifier, a
# property of the key. Import spellings the gate misses, each a false negative:
# an inline require("crypto").publicEncrypt(...), which no assignment precedes;
# a renamed ESM named import, import {publicEncrypt as pe} - the CJS renamed
# destructure does resolve, the ESM one does not; a dynamic await import().
# A bare same-named function in a file that does import node crypto still
# matches, the bare spellings having no receiver to bind.

rules:
  - id: javascript.crypto.rsa.sign-update
    message: Detected RSA signing via Node.js crypto Sign update
    severity: INFO
    mode: taint
    languages: [javascript, typescript]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '^["''](?i:RSA-(?:MD5|SHA1|SHA(?:3-)?(?:224|256|384|512)))["'']$'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  $SIGN = <... $CRYPTO.$MAKE($ALGO, ...) ...>
                  ...
                  <... $SIGN ...>.update(...)
              - pattern: |
                  $SIGN = <... $MAKE($ALGO, ...) ...>
                  ...
                  <... $SIGN ...>.update(...)
              - pattern: |
                  $SIGN = <... new $CRYPTO.$MAKE($ALGO, ...) ...>
                  ...
                  <... $SIGN ...>.update(...)
              - pattern: |
                  $SIGN = <... new $MAKE($ALGO, ...) ...>
                  ...
                  <... $SIGN ...>.update(...)
              - pattern: <... $CRYPTO.$MAKE($ALGO, ...) ...>.update(...)
              - pattern: <... $MAKE($ALGO, ...) ...>.update(...)
              - pattern: <... new $CRYPTO.$MAKE($ALGO, ...) ...>.update(...)
              - pattern: <... new $MAKE($ALGO, ...) ...>.update(...)
          - metavariable-regex:
              metavariable: $MAKE
              regex: '^(?:createSign|Sign)$'
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#class-sign
        - https://nodejs.org/api/crypto.html#cryptocreatesignalgorithm-options
        - https://nodejs.org/api/crypto.html#signupdatedata-inputencoding
      crypto:
        assetType: algorithm
        algorithmPrimitive: signature
        algorithmFamily: RSA
        algorithmName: RSA
        operation: "sign"
        parameterCondition: param[0]~=(?i:RSA-(MD5|SHA1|SHA(3-)?(224|256|384|512)))
        library: node:crypto
        api: crypto.Sign.update

