# RSA through the Node.js crypto Sign / Verify update(), sign() and verify(), the
# one-shot crypto.sign() / crypto.verify(), and crypto.{public,private}{Encrypt,
# Decrypt}. Six rules taint the algorithm string; the four -pss and two -oaep
# rules taint the padding constant instead, putting no condition on the algorithm
# argument - the null the Node docs pass included; the four base pke rules taint
# nothing. Class sinks take all four ways to get a Sign or a Verify - factory and
# exported constructor, with and without new - chained, or assigned and used
# later in the same statement sequence, through one intervening variable if need
# be. Every rule is gated on a require() or import of 'crypto' / 'node:crypto',
# which narrows the library without proving it.
#
# algorithmName is all that separates the -pss / -oaep six from the rule beside
# them, which matches the same call, so a call naming a padding constant reports
# twice; privateEncrypt / publicDecrypt have no -oaep rule, Node rejecting that
# padding there. The ten sign/verify rules infer RSA rather than prove it - Node
# reads a digest from the string and takes the scheme from the key, so
# 'RSA-SHA256' signs ECDSA under an EC key and a PSS padding is ignored on a
# non-RSA one - while the six pke rules prove it, throwing on any non-RSA key.
#
# Accepted by the six algorithm-string rules, case-insensitively:
#   RSA-{MD5,SHA1,SHA{224,256,384,512},SHA3-{224,256,384,512}}
#
# Accepted by the -pss and -oaep rules, case-sensitively, bare or under any
# dotted prefix (crypto.constants., constants.):
#   RSA_PKCS1_{PSS,OAEP}_PADDING
#
# Not matched: the long names ({md4,md5,sha1,sha{224,256,384,512},sha512-{224,
# 256},sm3}WithRSAEncryption, {ripemd160,mdc2}WithRSA,
# id-rsassa-pkcs1-v1_5-with-sha3-*); RSA-{MD4,SHA512/{224,256},RIPEMD160,MDC2,
# SM3}; dotted-decimal OIDs; backtick-quoted strings, the regexes being
# quote-anchored; a bare digest name, naming no scheme without a PSS padding
# beside it; the digest each RSA-* name also identifies, a separate hash
# component; key size, and the PKCS#1 v1.5 and no-padding constants, none having
# a field; key generation and crypto.subtle; a key options object held in a
# variable, and a module-scope padding constant read by a function declaration
# (the same flow into an arrow function is kept); a Sign or Verify whose creation
# and use sit in different functions, or a creation inside a try with the use
# after it; update() replaced by the stream interface, the terminating sign() /
# verify() still reporting; inline require('crypto').publicEncrypt(); and renamed
# imports - the ESM form always, the require() form unless a plain require of
# crypto sits beside it.

rules:
  - id: javascript.crypto.rsa.sign-update
    message: Detected RSA signing via Node.js crypto Sign update
    severity: INFO
    mode: taint
    languages: [javascript, typescript]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '(?i)^["'']RSA-(?:MD5|SHA1|SHA(?:3-)?(?:224|256|384|512))["'']$'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $C = require($MOD)
                          ...
                      - pattern-inside: |
                          import $C from $MOD
                          ...
                      - pattern-inside: |
                          import * as $C from $MOD
                          ...
                  - pattern-either:
                      - pattern: |
                          $CTX = <... $C.$MAKE($ALGO, ...) ...>
                          ...
                          <... $CTX ...>.update(...)
                      - pattern: |
                          $CTX = <... $C.$MAKE($ALGO, ...) ...>
                          ...
                          $CTX2 = <... $CTX ...>
                          ...
                          <... $CTX2 ...>.update(...)
                      - pattern: |
                          $CTX = <... new $C.$MAKE($ALGO, ...) ...>
                          ...
                          <... $CTX ...>.update(...)
                      - pattern: |
                          $CTX = <... new $C.$MAKE($ALGO, ...) ...>
                          ...
                          $CTX2 = <... $CTX ...>
                          ...
                          <... $CTX2 ...>.update(...)
                      - pattern: <... $C.$MAKE($ALGO, ...) ...>.update(...)
                      - pattern: <... new $C.$MAKE($ALGO, ...) ...>.update(...)
              - patterns:
