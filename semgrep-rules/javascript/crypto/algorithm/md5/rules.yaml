# MD5 hashing performed through the Node.js crypto Hash instance method
# digest().
#
# crypto.createHash(algorithm) selects the algorithm; the returned Hash instance
# produces the digest in digest(). The rules therefore taint the algorithm string
# and require the instance produced from it to reach a digest() call, so the
# finding only fires where a digest is actually computed.
#
# Every way of obtaining that instance is matched: the createHash factory, the
# undocumented but still exported Hash constructor, and that constructor called
# without new, which self-instantiates. The creation expression sits inside a
# deep-expression operator so the instance is still tracked when it arrives
# through one of the chainable methods that return this - update(), the stream
# setEncoding() and on(), and pipe(), which returns the Hash it piped into. The
# one other producer of a Hash is hash.copy(), which returns a second instance
# carrying the same algorithm and internal state; a copy taken into its own
# variable gets its own sink pattern, since its digest() is not syntactically
# reachable from the createHash call.
#
# parameterCondition constrains param[0] of the createHash factory that produced
# the instance, not of digest() itself.
#
# Not covered here: the md5-sha1 composite digest, whose two halves are two
# different algorithms, and the md5WithRSAEncryption and ssl3-md5 aliases,
# which name a signature scheme and a TLS 1.0 PRF construction rather than a
# bare digest. Also not covered, for every family in this library:
# the upper- and mixed-case spellings OpenSSL also resolves ('SHA256'), since the
# regexes are lowercase-only; streaming use where the Hash is written to or piped
# into and read back without digest() ever being called; and a copy of a copy,
# where the second copy() is taken from a variable holding the first.
rules:
  - id: javascript.crypto.md5.hash-digest
    message: Detected MD5 hashing via Node.js crypto Hash digest
    severity: INFO
    mode: taint
    languages: [javascript, typescript]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '^["'']md5["'']$'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  $HASH = <... $CRYPTO.$MAKE($ALGO, ...) ...>
                  ...
                  <... $HASH ...>.digest(...)
              - pattern: |
                  $HASH = <... $MAKE($ALGO, ...) ...>
                  ...
                  <... $HASH ...>.digest(...)
              - pattern: |
                  $HASH = <... new $CRYPTO.$MAKE($ALGO, ...) ...>
                  ...
                  <... $HASH ...>.digest(...)
              - pattern: |
                  $HASH = <... new $MAKE($ALGO, ...) ...>
                  ...
                  <... $HASH ...>.digest(...)
              - pattern: |
                  $HASH = <... $CRYPTO.$MAKE($ALGO, ...) ...>
                  ...
                  $COPY = <... $HASH.copy(...) ...>
                  ...
                  <... $COPY ...>.digest(...)
              - pattern: |
                  $HASH = <... $MAKE($ALGO, ...) ...>
                  ...
                  $COPY = <... $HASH.copy(...) ...>
                  ...
                  <... $COPY ...>.digest(...)
              - pattern: |
                  $HASH = <... new $CRYPTO.$MAKE($ALGO, ...) ...>
                  ...
                  $COPY = <... $HASH.copy(...) ...>
                  ...
                  <... $COPY ...>.digest(...)
              - pattern: |
                  $HASH = <... new $MAKE($ALGO, ...) ...>
                  ...
                  $COPY = <... $HASH.copy(...) ...>
                  ...
                  <... $COPY ...>.digest(...)
              - pattern: <... $CRYPTO.$MAKE($ALGO, ...) ...>.digest(...)
              - pattern: <... $MAKE($ALGO, ...) ...>.digest(...)
              - pattern: <... new $CRYPTO.$MAKE($ALGO, ...) ...>.digest(...)
              - pattern: <... new $MAKE($ALGO, ...) ...>.digest(...)
          - metavariable-regex:
              metavariable: $MAKE
              regex: '^(?:createHash|Hash)$'
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#class-hash
        - https://nodejs.org/api/crypto.html#cryptocreatehashalgorithm-options
        - https://nodejs.org/api/crypto.html#hashdigestencoding
        - https://nodejs.org/api/crypto.html#hashcopyoptions
      crypto:
        assetType: algorithm
        algorithmPrimitive: hash
        algorithmFamily: MD5
        algorithmName: MD5
        algorithmParameterSetIdentifier: "128"
        operation: "digest"
        parameterCondition: param[0]~=md5
        library: node:crypto
        api: crypto.Hash.digest
