# EdDSA through the one-shot Node.js crypto sign() and verify(). The Sign and
# Verify classes have no rules here because Node cannot use them with an Ed25519
# or Ed448 key at all: PureEdDSA has no streaming mode to hang update() off, so
# sign.sign() throws ERR_CRYPTO_UNSUPPORTED_OPERATION under every digest name,
# and the null algorithm the one-shot pair takes is not open to the class
# either, createSign(null) throwing ERR_INVALID_ARG_TYPE before a key is in
# hand. A class rule could therefore only match code that throws. The algorithm
# argument names nothing on the path that does work, so the family comes from
# the key: both rules taint the 'ed25519' / 'ed448' key-type literal and
# sink on the call the resulting key reaches, focused on the key argument. Both
# are gated on a require() or import of 'crypto' / 'node:crypto', which narrows
# the library without proving it.
#
# The two rules differ only in api, both emitting algorithmPrimitive: signature
# and algorithmFamily: EdDSA. Ed25519 and Ed448 are one family here, not two
# rules: nothing in the block would tell the pair apart, and the variant stays
# in the matched source.
#
# Accepted as key-type names, case-insensitively:
#   ed25519, ed448
#
# Not matched: Ed25519ph / Ed25519ctx, which Node does not expose; the 'EdDSA'
# and 'Ed25519' JOSE/COSE algorithm names, naming no Node API argument;
# backtick-quoted strings, the regexes being quote-anchored; a key with no
# key-type literal in the file - crypto.createPrivateKey() on a PEM, a key read
# from disk or passed in as a parameter; a keypair generated at module scope and
# signed with from inside a function, and the callback form of
# crypto.generateKeyPair(), taint crossing neither a closure nor a callback
# parameter; X25519 / X448, a key-agree family with no directory of its own; and
# renamed imports - the ESM form always, the require() form unless a plain
# require of crypto sits beside it.

rules:
  - id: javascript.crypto.eddsa.sign
    message: Detected EdDSA signing via Node.js crypto sign
    severity: INFO
    mode: taint
    languages: [javascript, typescript]

    pattern-sources:
      - patterns:
          - pattern: $CURVE
          - metavariable-regex:
              metavariable: $CURVE
              regex: '(?i)^["''](?:ed25519|ed448)["'']$'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $C = require($MOD)
                          ...
                      - pattern-inside: |
                          import $C from $MOD
                          ...
                      - pattern-inside: |
                          import * as $C from $MOD
                          ...
                  - pattern-either:
                      - pattern: $C.sign($ALGO, $DATA, $KEY, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $C = require($MOD)
                          ...
                      - pattern-inside: |
                          import {...} from $MOD
                          ...
                  - pattern-either:
                      - pattern: sign($ALGO, $DATA, $KEY, ...)
          - metavariable-regex:
              metavariable: $MOD
              regex: '^["'']?(?:node:)?crypto["'']?$'
          - focus-metavariable: $KEY

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#cryptosignalgorithm-data-key-callback
        - https://nodejs.org/api/crypto.html#cryptogeneratekeypairsynctype-options
      crypto:
        assetType: algorithm
        algorithmPrimitive: signature
        algorithmFamily: EdDSA
        library: node:crypto
        api: crypto.sign

  - id: javascript.crypto.eddsa.verify
    message: Detected EdDSA signature verification via Node.js crypto verify
    severity: INFO
    mode: taint
    languages: [javascript, typescript]

    pattern-sources:
      - patterns:
          - pattern: $CURVE
          - metavariable-regex:
              metavariable: $CURVE
              regex: '(?i)^["''](?:ed25519|ed448)["'']$'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $C = require($MOD)
                          ...
                      - pattern-inside: |
                          import $C from $MOD
                          ...
                      - pattern-inside: |
                          import * as $C from $MOD
                          ...
                  - pattern-either:
                      - pattern: $C.verify($ALGO, $DATA, $KEY, $SIG, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $C = require($MOD)
                          ...
                      - pattern-inside: |
                          import {...} from $MOD
                          ...
                  - pattern-either:
                      - pattern: verify($ALGO, $DATA, $KEY, $SIG, ...)
          - metavariable-regex:
              metavariable: $MOD
              regex: '^["'']?(?:node:)?crypto["'']?$'
          - focus-metavariable: $KEY

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#cryptoverifyalgorithm-data-key-signature-callback
        - https://nodejs.org/api/crypto.html#cryptogeneratekeypairsynctype-options
      crypto:
        assetType: algorithm
        algorithmPrimitive: signature
        algorithmFamily: EdDSA
        library: node:crypto
        api: crypto.verify
