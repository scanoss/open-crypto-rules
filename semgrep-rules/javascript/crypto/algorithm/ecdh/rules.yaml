# ECDH key agreement through Node.js crypto: computeSecret() on an ECDH
# instance, and the one-shot crypto.diffieHellman() over generated EC
# KeyObjects. Two rules, api telling them apart.
#
# Neither API names ECDH at the call, so both match on the producer instead.
# computeSecret() fires only on an instance the same statement sequence traces
# back to createECDH() or the exported ECDH constructor - createDiffieHellman()
# hands back an object with the same method name and a different family - taking
# all four ways to get one, factory and constructor, with and without new, Node's
# legacy classes self-instantiating, chained or assigned and used later.
# diffieHellman() fires only where a key it is handed is tainted by a
# generateKeyPair{,Sync}('ec', ...): the call takes finite-field 'dh' KeyObjects
# just as readily, and asymmetricKeyType is a runtime value no pattern can read.
# Both are gated on a require() or import of 'crypto' / 'node:crypto', which
# narrows the library without proving it.
#
# The five emitted fields are static and none of them records the curve, so
# neither the createECDH curve nor namedCurve carries any condition: a literal, a
# variable and a runtime parameter all report the same finding. The only regexes
# are on the producer name, the key type and the module specifier.
#
# Accepted: producers createECDH, ECDH, generateKeyPair{,Sync}; key type 'ec';
# module specifiers {node:,}crypto, quoted or bare; all curve arguments.
#
# Not matched: 'x25519' and 'x448' keys, curve agreement of other families owing
# directories of their own (createECDH reaches neither, both being absent from
# crypto.getCurves()); keys from create{Private,Public}Key() or a keystore,
# nothing in the pattern proving them EC; the generateKeyPair callback form and
# the util.promisify() form, neither returning the keys to taint; the other ECDH
# methods (generateKeys, {get,set}{Public,Private}Key) and the static
# ECDH.convertKey, none of them a key agreement; DH computeSecret off
# createDiffieHellman{,Group} and diffieHellman() over 'dh' keys, a family owing
# its own directory; crypto.subtle; an ECDH whose creation and use sit in
# different functions; inline require('crypto').createECDH(...).computeSecret();
# and renamed imports, the call name having to be one of the four producers.

rules:
  - id: javascript.crypto.ecdh.compute-secret
    message: Detected ECDH key agreement via Node.js crypto ECDH computeSecret
    severity: INFO
    languages: [javascript, typescript]

    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $C = require($MOD)
                      ...
                  - pattern-inside: |
                      import $C from $MOD
                      ...
                  - pattern-inside: |
                      import * as $C from $MOD
                      ...
              - pattern-either:
                  - pattern: |
                      $ECDH = <... $C.$MAKE(...) ...>
                      ...
                      <... $ECDH ...>.computeSecret(...)
                  - pattern: |
                      $ECDH = <... new $C.$MAKE(...) ...>
                      ...
                      <... $ECDH ...>.computeSecret(...)
                  - pattern: <... $C.$MAKE(...) ...>.computeSecret(...)
                  - pattern: <... new $C.$MAKE(...) ...>.computeSecret(...)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $C = require($MOD)
                      ...
                  - pattern-inside: |
                      import {...} from $MOD
                      ...
              - pattern-either:
                  - pattern: |
                      $ECDH = <... $MAKE(...) ...>
                      ...
                      <... $ECDH ...>.computeSecret(...)
                  - pattern: |
                      $ECDH = <... new $MAKE(...) ...>
                      ...
                      <... $ECDH ...>.computeSecret(...)
                  - pattern: <... $MAKE(...) ...>.computeSecret(...)
                  - pattern: <... new $MAKE(...) ...>.computeSecret(...)
      - metavariable-regex:
          metavariable: $MOD
          regex: '^["'']?(?:node:)?crypto["'']?$'
      - metavariable-regex:
          metavariable: $MAKE
          regex: '^(?:createECDH|ECDH)$'

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#class-ecdh
        - https://nodejs.org/api/crypto.html#cryptocreateecdhcurvename
        - https://nodejs.org/api/crypto.html#ecdhcomputesecretotherpublickey-inputencoding-outputencoding
      crypto:
        assetType: algorithm
        algorithmPrimitive: key-agree
        algorithmFamily: ECDH
        library: node:crypto
        api: crypto.ECDH.computeSecret

  - id: javascript.crypto.ecdh.diffie-hellman
    message: Detected ECDH key agreement via Node.js crypto diffieHellman
    severity: INFO
    mode: taint
    languages: [javascript, typescript]

    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $K.$GEN($TYPE, ...)
              - pattern: $GEN($TYPE, ...)
          - metavariable-regex:
              metavariable: $GEN
              regex: '^generateKeyPair(?:Sync)?$'
          - metavariable-regex:
              metavariable: $TYPE
              regex: '(?i)^["'']ec["'']$'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $C = require($MOD)
                          ...
                      - pattern-inside: |
                          import $C from $MOD
                          ...
                      - pattern-inside: |
                          import * as $C from $MOD
                          ...
                  - pattern: $C.diffieHellman(...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $C = require($MOD)
                          ...
                      - pattern-inside: |
                          import {...} from $MOD
                          ...
                  - pattern: diffieHellman(...)
          - metavariable-regex:
              metavariable: $MOD
              regex: '^["'']?(?:node:)?crypto["'']?$'

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#cryptodiffiehellmanoptions
        - https://nodejs.org/api/crypto.html#cryptogeneratekeypairsynctype-options
      crypto:
        assetType: algorithm
        algorithmPrimitive: key-agree
        algorithmFamily: ECDH
        library: node:crypto
        api: crypto.diffieHellman
