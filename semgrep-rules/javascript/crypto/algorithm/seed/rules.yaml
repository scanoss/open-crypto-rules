# SEED encryption / decryption performed through the Node.js crypto
# Cipheriv and Decipheriv instance method update().
#
# crypto.createCipheriv(algorithm, key, iv) / crypto.createDecipheriv(...) select
# the algorithm; the returned Cipheriv / Decipheriv instance performs the work in
# update(). The rules therefore taint the algorithm string and require the
# instance produced from it to reach an update() call, so the finding only fires
# where data is actually enciphered.
#
# Every way of obtaining that instance is matched: the factories, the
# undocumented but still exported Cipheriv / Decipheriv constructors, and those
# same constructors called without new, which self-instantiate. The creation
# expression sits inside a deep-expression operator so the instance is still
# tracked when it arrives through one of the chainable methods that return this
# - setAutoPadding(), setAAD() and, on Decipheriv, setAuthTag().
#
# parameterCondition constrains param[0] of the createCipheriv / createDecipheriv
# factory that produced the instance, not of update() itself.
#
# Not covered: Cipheriv / Decipheriv are Transform streams, so data can also be
# enciphered by piping into the instance or by write() / end() with no update()
# call at all. That form carries the same algorithm metadata but is outside the
# scope of these update() rules.
#
# SEED is defined with a single 128-bit key size (RFC 4269).
rules:
  - id: javascript.crypto.seed.cipheriv-update
    message: Detected SEED encryption via Node.js crypto Cipheriv update
    severity: INFO
    mode: taint
    languages: [javascript, typescript]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '^["'']seed-(?<mode>cbc|cfb|ecb|ofb)["'']$'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  $CIPHER = <... $CRYPTO.$MAKE($ALGO, ...) ...>
                  ...
                  $CIPHER.update(...)
              - pattern: |
                  $CIPHER = <... $MAKE($ALGO, ...) ...>
                  ...
                  $CIPHER.update(...)
              - pattern: |
                  $CIPHER = <... new $CRYPTO.$MAKE($ALGO, ...) ...>
                  ...
                  $CIPHER.update(...)
              - pattern: |
                  $CIPHER = <... new $MAKE($ALGO, ...) ...>
                  ...
                  $CIPHER.update(...)
              - pattern: <... $CRYPTO.$MAKE($ALGO, ...) ...>.update(...)
              - pattern: <... $MAKE($ALGO, ...) ...>.update(...)
              - pattern: <... new $CRYPTO.$MAKE($ALGO, ...) ...>.update(...)
              - pattern: <... new $MAKE($ALGO, ...) ...>.update(...)
          - metavariable-regex:
              metavariable: $MAKE
              regex: '^(?:createCipheriv|Cipheriv)$'
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#cryptocreatecipherivalgorithm-key-iv-options
        - https://nodejs.org/api/crypto.html#cipherupdatedata-inputencoding-outputencoding
      crypto:
        assetType: algorithm
        algorithmPrimitive: block-cipher
        algorithmFamily: SEED
        algorithmName: SEED
        algorithmMode: $mode
        algorithmParameterSetIdentifier: "128"
        operation: "encrypt"
        parameterCondition: param[0]~=seed-(cbc|cfb|ecb|ofb)
        library: node:crypto
        api: crypto.Cipheriv.update

  - id: javascript.crypto.seed.decipheriv-update
    message: Detected SEED decryption via Node.js crypto Decipheriv update
    severity: INFO
    mode: taint
    languages: [javascript, typescript]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '^["'']seed-(?<mode>cbc|cfb|ecb|ofb)["'']$'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  $DECIPHER = <... $CRYPTO.$MAKE($ALGO, ...) ...>
                  ...
                  $DECIPHER.update(...)
              - pattern: |
                  $DECIPHER = <... $MAKE($ALGO, ...) ...>
                  ...
                  $DECIPHER.update(...)
              - pattern: |
                  $DECIPHER = <... new $CRYPTO.$MAKE($ALGO, ...) ...>
                  ...
                  $DECIPHER.update(...)
              - pattern: |
                  $DECIPHER = <... new $MAKE($ALGO, ...) ...>
                  ...
                  $DECIPHER.update(...)
              - pattern: <... $CRYPTO.$MAKE($ALGO, ...) ...>.update(...)
              - pattern: <... $MAKE($ALGO, ...) ...>.update(...)
              - pattern: <... new $CRYPTO.$MAKE($ALGO, ...) ...>.update(...)
              - pattern: <... new $MAKE($ALGO, ...) ...>.update(...)
          - metavariable-regex:
              metavariable: $MAKE
              regex: '^(?:createDecipheriv|Decipheriv)$'
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#cryptocreatedecipherivalgorithm-key-iv-options
        - https://nodejs.org/api/crypto.html#decipherupdatedata-inputencoding-outputencoding
      crypto:
        assetType: algorithm
        algorithmPrimitive: block-cipher
        algorithmFamily: SEED
        algorithmName: SEED
        algorithmMode: $mode
        algorithmParameterSetIdentifier: "128"
        operation: "decrypt"
        parameterCondition: param[0]~=seed-(cbc|cfb|ecb|ofb)
        library: node:crypto
        api: crypto.Decipheriv.update
