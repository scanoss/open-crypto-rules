# AES encryption / decryption through the Node.js crypto Cipheriv and Decipheriv
# instance method update(). The algorithm string passed to the producer is the
# taint source and the instance it returns has to reach an update() call. Every
# producer is matched - createCipheriv / createDecipheriv, the exported Cipheriv
# / Decipheriv constructors, and those constructors without new - with both the
# creation expression and the instance inside a deep-expression operator, so the
# chainable setAutoPadding(), setAAD() and setAuthTag() are absorbed. The
# algorithm string does not prove the library (crypto-browserify exposes the same
# signature), so every producer is gated on an import of node's crypto; the
# qualified spellings also bind the receiver to the imported alias, the bare ones
# rest on the import alone, and an inline require("crypto").createCipheriv()
# matches neither. The gate does not prove the library either, since bundlers
# alias the bare 'crypto' specifier to crypto-browserify.
#
# Nothing is captured - every emitted field is static - so the regexes only gate
# the match, and base / aead are separate rules only because algorithmPrimitive
# differs: block-cipher against ae. Both regexes are a deliberately loose
# superset of the lists below and accept spellings no Node build resolves
# (aes256-ofb, aes-256-ctr8, aes256-gcm, id-aes-256-gcm, anything -cts); each
# throws ERR_CRYPTO_UNKNOWN_CIPHER, so no code that runs can match one.
#
# Accepted, case-insensitively:
#   base: aes-{128,192,256}-{cbc,cfb,ctr,ecb,ofb}, plus the cfb1 / cfb8 widths
#   aead: aes-{128,192,256}-{gcm,ccm}, id-aes{128,192,256}-{gcm,ccm}
#
# Not covered: the mode-less aliases AES{128,192,256}; dotted-decimal OIDs; the
# cbc-hmac-sha{1,256} composites; xts, ocb, siv and gcm-siv, which would emit
# nothing the existing rules do not; aes256-wrap, which would need its own rule
# for algorithmPrimitive key-wrap; the Transform stream interface, where pipe()
# or write() / end() encipher with no update() call; and renamed named imports.

rules:
  - id: javascript.crypto.aes.cipheriv-update
    message: Detected AES encryption via Node.js crypto Cipheriv update
    severity: INFO
    mode: taint
    languages: [javascript, typescript]

    pattern-sources:
      - patterns:
          - pattern: $ALGO
          - metavariable-regex:
              metavariable: $ALGO
              regex: '(?i)^["'']aes-?(?:128|192|256)-(?:cbc|cfb|ctr|ecb|ofb)(?:1|8)?(?:-cts)?["'']$'

    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $C = require($MOD)
                          ...
                      - pattern-inside: |
                          import $C from $MOD
                          ...
                      - pattern-inside: |
                          import * as $C from $MOD
                          ...
                  - pattern-either:
                      - pattern: |
                          $CIPHER = <... $C.$MAKE($ALGO, ...) ...>
                          ...
                          <... $CIPHER ...>.update(...)
                      - pattern: |
                          $CIPHER = <... new $C.$MAKE($ALGO, ...) ...>
                          ...
                          <... $CIPHER ...>.update(...)
                      - pattern: <... $C.$MAKE($ALGO, ...) ...>.update(...)
                      - pattern: <... new $C.$MAKE($ALGO, ...) ...>.update(...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $C = require($MOD)
                          ...
                      - pattern-inside: |
                          import {...} from $MOD
                          ...
                  - pattern-either:
                      - pattern: |
                          $CIPHER = <... $MAKE($ALGO, ...) ...>
                          ...
                          <... $CIPHER ...>.update(...)
                      - pattern: |
                          $CIPHER = <... new $MAKE($ALGO, ...) ...>
                          ...
                          <... $CIPHER ...>.update(...)
                      - pattern: <... $MAKE($ALGO, ...) ...>.update(...)
                      - pattern: <... new $MAKE($ALGO, ...) ...>.update(...)
          - metavariable-regex:
              metavariable: $MOD
              regex: '^["'']?(?:node:)?crypto["'']?$'
          - metavariable-regex:
              metavariable: $MAKE
              regex: '^(?:createCipheriv|Cipheriv)$'
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#cryptocreatecipherivalgorithm-key-iv-options
        - https://nodejs.org/api/crypto.html#cipherupdatedata-inputencoding-outputencoding
      crypto:
        assetType: algorithm
        algorithmPrimitive: block-cipher
        algorithmFamily: AES
        library: node:crypto
        api: crypto.Cipheriv.update

