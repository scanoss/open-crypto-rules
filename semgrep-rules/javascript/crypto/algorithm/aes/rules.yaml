    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  $DECIPHER = $CRYPTO.createDecipheriv($ALGO, ...)
                  ...
                  $DECIPHER.update(...)
              - pattern: |
                  $DECIPHER = createDecipheriv($ALGO, ...)
                  ...
                  $DECIPHER.update(...)
              - pattern: |
                  $DECIPHER = new $CRYPTO.Decipheriv($ALGO, ...)
                  ...
                  $DECIPHER.update(...)
              - pattern: |
                  $DECIPHER = new Decipheriv($ALGO, ...)
                  ...
                  $DECIPHER.update(...)
              - pattern: $CRYPTO.createDecipheriv($ALGO, ...).update(...)
              - pattern: createDecipheriv($ALGO, ...).update(...)
              - pattern: new $CRYPTO.Decipheriv($ALGO, ...).update(...)
              - pattern: new Decipheriv($ALGO, ...).update(...)
          - focus-metavariable: $ALGO

    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#cryptocreatedecipherivalgorithm-key-iv-options
        - https://nodejs.org/api/crypto.html#decipherupdatedata-inputencoding-outputencoding
      crypto:
        assetType: algorithm
        algorithmPrimitive: block-cipher
        algorithmFamily: AES
        algorithmName: AES
        algorithmMode: $mode
        algorithmParameterSetIdentifier: $keysize
        operation: "decrypt"
        parameterCondition: param[0]~=aes-(128|192|256)-(cbc|cfb|ctr|ecb|ofb)
        library: node:crypto
        api: crypto.Decipheriv.update

  - id: javascript.crypto.aes.cipheriv-update-aead
    message: Detected AES authenticated encryption via Node.js crypto Cipheriv update
