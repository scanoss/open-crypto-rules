                      - pattern: |
                          $CTX = <... new $C.$MAKE($ALGO, ...) ...>
                          ...
                          <... $CTX ...>.update(...)
                          ...
                          <... $CTX ...>.sign($KEY, ...)
                      - pattern: |
                          $CTX = <... new $C.$MAKE($ALGO, ...) ...>
                          ...
                          $CTX2 = <... $CTX ...>
                          ...
                          <... $CTX2 ...>.update(...)
