                      - pattern: <... <... new $MAKE($ALGO, ...) ...>.update(...) ...>.sign($KEY, ...)
          - metavariable-regex:
              metavariable: $MOD
              regex: '^["'']?(?:node:)?crypto["'']?$'
          - metavariable-regex:
              metavariable: $MAKE
              regex: '^(?:createSign|Sign)$'
          - focus-metavariable: $KEY

    metadata:
