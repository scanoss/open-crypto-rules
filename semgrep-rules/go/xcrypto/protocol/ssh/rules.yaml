rules:
  - id: go.xcrypto.ssh.key-parsing
    message: Detected SSH key parsing operations
    severity: INFO
    languages: [go]
    patterns:
      - pattern-either:
          - pattern-inside: |
              import (
                ...
                "golang.org/x/crypto/ssh"
                ...
              )
              ...
          - pattern-inside: |
              import "golang.org/x/crypto/ssh"
              ...
      - pattern: ssh.$FUNC(...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: "^(?<func>ParsePrivateKey|ParsePrivateKeyWithPassphrase|ParseRawPrivateKey|ParseRawPrivateKeyWithPassphrase|ParseDSAPrivateKey|ParsePublicKey|ParseAuthorizedKey|ParseKnownHosts)$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/ssh
      crypto:
        assetType: protocol
        protocolType: ssh
        protocolName: SSH
        findingType: key_generation
        operation: keygen
        library: golang.org/x/crypto/ssh
        api: ssh.$func
        materialSource: imported

  - id: go.xcrypto.ssh.key-marshaling
