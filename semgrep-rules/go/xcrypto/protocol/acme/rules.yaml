rules:
  - id: go.xcrypto.acme.client-creation
    message: Detected ACME client creation
    severity: INFO
    languages: [go]
    patterns:
      - pattern-either:
          - pattern-inside: |
              import (
                ...
                "golang.org/x/crypto/acme"
                ...
              )
              ...
          - pattern-inside: |
              import "golang.org/x/crypto/acme"
              ...
      - pattern-either:
          - pattern: |
              &acme.Client{...}
          - pattern: |
              acme.Client{...}
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/acme
      crypto:
        assetType: protocol
        protocolType: other
        protocolName: ACME
        findingType: certificate_handling
        operation: other
        library: golang.org/x/crypto/acme
        api: acme.Client

  - id: go.xcrypto.acme.client-operations
    message: Detected ACME client operations
    severity: INFO
    languages: [go]
    mode: taint
    pattern-sources:
      - pattern: |
          &acme.Client{...}
      - pattern: |
          acme.Client{...}
    pattern-propagators:
      - pattern: |
          &$TYPE{..., Client: $SRC, ...}
        from: $SRC
        to: $TYPE
      - pattern: $OBJ.Client
        from: $OBJ
        to: $OBJ.Client
    pattern-sinks:
      - patterns:
          - pattern: $CLIENT.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: "^(?<func>Discover|GetReg|UpdateReg|DeactivateReg|AccountKeyRollover)$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/acme
      crypto:
        assetType: protocol
        protocolType: other
        protocolName: ACME
        findingType: certificate_handling
        operation: other
        library: golang.org/x/crypto/acme
        api: acme.Client.$func

