rules:
  - id: go.xcrypto.otr.encrypt
    message: Detected OTR encryption operations
    severity: INFO
    languages: [go]
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import (
                    ...
                    "golang.org/x/crypto/otr"
                    ...
                  )
                  ...
              - pattern-inside: |
                  import "golang.org/x/crypto/otr"
                  ...
          - pattern-either:
              - pattern: |
                  &otr.Conversation{...}
              - pattern: |
                  otr.Conversation{...}
              - pattern: |
                  ($CONV : *otr.Conversation)
              - pattern: |
                  ($CONV : otr.Conversation)
              - pattern: |
                  var $CONV otr.Conversation
              - pattern: |
                  var $CONV *otr.Conversation
    pattern-propagators:
      - pattern: |
          &$TYPE{..., Conversation: $SRC, ...}
        from: $SRC
        to: $TYPE
      - pattern: $OBJ.Conversation
        from: $OBJ
        to: $OBJ.Conversation
      - pattern: |
          &$TYPE{..., Conv: $SRC, ...}
        from: $SRC
        to: $TYPE
      - pattern: $OBJ.Conv
        from: $OBJ
        to: $OBJ.Conv
    pattern-sinks:
      - patterns:
          - pattern: $CONV.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: "^(?<func>Send)$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/otr
      crypto:
        assetType: protocol
        findingType: cipher
        operation: encrypt
        protocolType: other
        protocolName: OTR
        library: golang.org/x/crypto/otr
        api: otr.Conversation.$func

