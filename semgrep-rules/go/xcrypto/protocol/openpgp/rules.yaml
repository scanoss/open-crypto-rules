rules:
  - id: go.xcrypto.openpgp.read-message
    message: Detected OpenPGP message reading, protocol=OpenPGP
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: openpgp.ReadMessage($READER, $KEYRING, $PROMPT, $CONFIG)
          - pattern:
              "$MSG, $ERR := openpgp.ReadMessage($READER, $KEYRING, $PROMPT, $CONFIG)

              "
          - pattern:
              "$MSG, _ := openpgp.ReadMessage($READER, $KEYRING, $PROMPT, $CONFIG)

              "
          - pattern: openpgp.ReadMessage(...)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/openpgp
      crypto:
        assetType: protocol
        findingType: cipher
        operation: decrypt
        protocolName: OpenPGP
        protocolType: other
        library: golang.org/x/crypto/openpgp
        api: openpgp.ReadMessage

