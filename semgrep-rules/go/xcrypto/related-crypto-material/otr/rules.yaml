rules:
  - id: go.xcrypto.otr.privatekey-generation
    message: Detected OTR private key generation
    severity: INFO
    languages: [go]
    patterns:
      - pattern-either:
          - pattern-inside: |
              import (
                ...
                "golang.org/x/crypto/otr"
                ...
              )
              ...
          - pattern-inside: |
              import "golang.org/x/crypto/otr"
              ...
      - pattern: $KEY.Generate(...)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/otr
      crypto:
        assetType: related-crypto-material
        findingType: key_generation
        operation: other
        materialType: private-key
        library: golang.org/x/crypto/otr
        api: otr.PrivateKey.Generate

  - id: go.xcrypto.otr.privatekey-operations
    message: Detected OTR private key operation
    severity: INFO
    languages: [go]
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import (
                    ...
                    "golang.org/x/crypto/otr"
                    ...
                  )
                  ...
              - pattern-inside: |
                  import "golang.org/x/crypto/otr"
                  ...
          - pattern-either:
              - pattern: |
                  ($KEY : otr.PrivateKey)
              - pattern: |
                  ($KEY : *otr.PrivateKey)
              - pattern: |
                  var $KEY otr.PrivateKey
              - pattern: |
                  var $KEY *otr.PrivateKey
              - pattern: |
                  otr.PrivateKey{...}
              - pattern: |
                  &otr.PrivateKey{...}
    pattern-propagators:
      - pattern: |
          &$TYPE{..., PrivateKey: $SRC, ...}
        from: $SRC
        to: $TYPE
      - pattern: $OBJ.PrivateKey
        from: $OBJ
        to: $OBJ.PrivateKey
      - pattern: |
          &$TYPE{..., Key: $SRC, ...}
        from: $SRC
        to: $TYPE
      - pattern: $OBJ.Key
        from: $OBJ
        to: $OBJ.Key
    pattern-sinks:
      - patterns:
          - pattern: $PRIVKEY.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: "^(?<func>Import|Serialize|Parse)$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/otr
      crypto:
        assetType: related-crypto-material
        findingType: key_generation
        operation: other
        materialType: private-key
        library: golang.org/x/crypto/otr
        api: otr.PrivateKey.$func

