rules:
  - id: go.xcrypto.cryptobyte.usage
    message: Detected cryptobyte usage for encoding/decoding cryptographic data structures
    severity: INFO
    languages: [go]
    patterns:
      - pattern-either:
          - pattern-inside: |
              import (
                ...
                "golang.org/x/crypto/cryptobyte"
                ...
              )
              ...
          - pattern-inside: |
              import "golang.org/x/crypto/cryptobyte"
              ...
      - pattern: cryptobyte.$FUNC(...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: "^(?<func>NewBuilder|String)$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/cryptobyte
      crypto:
        assetType: other
        findingType: other
        operation: other
        library: golang.org/x/crypto/cryptobyte
        api: cryptobyte.$func
