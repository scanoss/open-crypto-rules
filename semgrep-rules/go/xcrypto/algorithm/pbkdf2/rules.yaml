rules:
  - id: go.xcrypto.pbkdf2.key-derivation
    message:
      Detected PBKDF2 key derivation with hash=$hash, iterations=$iterations,
      keylen=$keylen
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - patterns:
              - pattern: pbkdf2.Key($PASSWORD, $SALT, $ITERATIONS, $KEY_LENGTH, $HASH)
              - metavariable-regex:
                  metavariable: $HASH
                  regex: '(?<hash>sha256|sha512|sha224|sha384|sha512_224|sha512_256|sha1|md5)\.(?:New|New224|New384|New512_224|New512_256)'
              - metavariable-regex:
                  metavariable: $ITERATIONS
                  regex: '^(?<iterations>\d+)$'
              - metavariable-regex:
                  metavariable: $KEY_LENGTH
                  regex: "^(?<keylen>16|24|32|64)$"
          - patterns:
              - pattern: pbkdf2.Key($PASSWORD, $SALT, $ITERATIONS, $KEY_LENGTH, $HASH)
              - metavariable-regex:
                  metavariable: $HASH
                  regex: 'crypto\.(?<hash>SHA256|SHA512|SHA224|SHA384|SHA512_224|SHA512_256|SHA1|MD5)\.New'
              - metavariable-regex:
                  metavariable: $ITERATIONS
                  regex: '^(?<iterations>\d+)$'
              - metavariable-regex:
                  metavariable: $KEY_LENGTH
                  regex: "^(?<keylen>16|24|32|64)$"
          - patterns:
              - pattern: pbkdf2.Key($PASSWORD, $SALT, $ITERATIONS, $KEY_LENGTH, $HASH)
              - metavariable-regex:
                  metavariable: $HASH
                  regex: '(?<hash>sha256|sha512|sha224|sha384|sha512_224|sha512_256|sha1|md5)\.(?:New|New224|New384|New512_224|New512_256)'
              - metavariable-regex:
                  metavariable: $ITERATIONS
                  regex: '^(?<iterations>\d+)$'
          - patterns:
              - pattern: pbkdf2.Key($PASSWORD, $SALT, $ITERATIONS, $KEY_LENGTH, $HASH)
              - metavariable-regex:
                  metavariable: $HASH
                  regex: 'crypto\.(?<hash>SHA256|SHA512|SHA224|SHA384|SHA512_224|SHA512_256|SHA1|MD5)\.New'
              - metavariable-regex:
                  metavariable: $ITERATIONS
                  regex: '^(?<iterations>\d+)$'
          - patterns:
              - pattern: pbkdf2.Key($PASSWORD, $SALT, $ITERATIONS, $KEY_LENGTH, $HASH)
              - metavariable-regex:
                  metavariable: $HASH
                  regex: '(?<hash>sha256|sha512|sha224|sha384|sha512_224|sha512_256|sha1|md5)\.(?:New|New224|New384|New512_224|New512_256)'
              - metavariable-regex:
                  metavariable: $KEY_LENGTH
                  regex: "^(?<keylen>16|24|32|64)$"
          - patterns:
              - pattern: pbkdf2.Key($PASSWORD, $SALT, $ITERATIONS, $KEY_LENGTH, $HASH)
              - metavariable-regex:
                  metavariable: $HASH
                  regex: 'crypto\.(?<hash>SHA256|SHA512|SHA224|SHA384|SHA512_224|SHA512_256|SHA1|MD5)\.New'
              - metavariable-regex:
                  metavariable: $KEY_LENGTH
                  regex: "^(?<keylen>16|24|32|64)$"
          - patterns:
              - pattern: pbkdf2.Key($PASSWORD, $SALT, $ITERATIONS, $KEY_LENGTH, $HASH)
              - metavariable-regex:
                  metavariable: $HASH
                  regex: '(?<hash>sha256|sha512|sha224|sha384|sha512_224|sha512_256|sha1|md5)\.(?:New|New224|New384|New512_224|New512_256)'
          - patterns:
              - pattern: pbkdf2.Key($PASSWORD, $SALT, $ITERATIONS, $KEY_LENGTH, $HASH)
              - metavariable-regex:
                  metavariable: $HASH
                  regex: 'crypto\.(?<hash>SHA256|SHA512|SHA224|SHA384|SHA512_224|SHA512_256|SHA1|MD5)\.New'
          - pattern: pbkdf2.Key($PASSWORD, $SALT, $ITERATIONS, $KEY_LENGTH, $HASH)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/pbkdf2
      crypto:
        assetType: algorithm
        findingType: kdf
        operation: keyderive
        primitive: kdf
        algorithmName: PBKDF2-$hash-$iterations-$keylen
        algorithmFamily: PBKDF2
        parameterSetIdentifier: $iterations-$keylen
        iterations: $iterations
        library: golang.org/x/crypto/pbkdf2
        api: pbkdf2.Key
        materialSource: derived
