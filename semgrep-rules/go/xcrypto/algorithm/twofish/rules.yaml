rules:
  - id: go.xcrypto.twofish.block-cipher
    message: Detected Twofish block cipher usage, algorithm=Twofish
    severity: INFO
    languages: [go]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import (
                    ...
                    "golang.org/x/crypto/twofish"
                    ...
                  )
                  ...
              - pattern-inside: |
                  import "golang.org/x/crypto/twofish"
                  ...
          - pattern: twofish.NewCipher(make([]byte, $SIZE))
          - metavariable-regex:
              metavariable: $SIZE
              regex: "^(?<keysize>16|24|32)$"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import (
                    ...
                    "golang.org/x/crypto/twofish"
                    ...
                  )
                  ...
              - pattern-inside: |
                  import "golang.org/x/crypto/twofish"
                  ...
          - pattern: twofish.NewCipher(...)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/twofish
      crypto:
        assetType: algorithm
        findingType: cipher
        algorithmPrimitive: block-cipher
        algorithmName: Twofish
        algorithmFamily: Twofish
        algorithmParameterSetIdentifier: $keysize
        library: golang.org/x/crypto/twofish
        api: twofish.NewCipher
