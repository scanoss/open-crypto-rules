rules:
  - id: go.xcrypto.twofish.block-cipher
    message: Detected Twofish block cipher usage, algorithm=Twofish
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: twofish.NewCipher(make([]byte, $SIZE))
                  - pattern: |
                      $CIPHER, $ERR := twofish.NewCipher(make([]byte, $SIZE))
                  - pattern: |
                      $CIPHER, _ := twofish.NewCipher(make([]byte, $SIZE))
              - metavariable-regex:
                  metavariable: $SIZE
                  regex: "^(?<keysize>16|24|32)$"
          - patterns:
              - pattern-either:
                  - pattern: |
                      $KEY := make([]byte, $SIZE)
                      ...
                      twofish.NewCipher($KEY)
                  - pattern: |
                      $KEY := make([]byte, $SIZE)
                      ...
                      $CIPHER, $ERR := twofish.NewCipher($KEY)
                  - pattern: |
                      $KEY := make([]byte, $SIZE)
                      ...
                      $CIPHER, _ := twofish.NewCipher($KEY)
              - metavariable-regex:
                  metavariable: $SIZE
                  regex: "^(?<keysize>16|24|32)$"
          - pattern-either:
              - pattern: twofish.NewCipher($KEY)
              - pattern: |
                  $CIPHER, $ERR := twofish.NewCipher($KEY)
              - pattern: |
                  $CIPHER, _ := twofish.NewCipher($KEY)
              - pattern: twofish.NewCipher(...)
          - pattern-either:
              - pattern: $VAR = twofish.NewCipher
              - pattern: _ = twofish.NewCipher
              - pattern: twofish.NewCipher
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/twofish
      crypto:
        assetType: algorithm
        findingType: cipher
        operation: encrypt
        primitive: block-cipher
        algorithmName: Twofish
        algorithmFamily: Twofish
        parameterSetIdentifier: $keysize
        library: golang.org/x/crypto/twofish
        api: twofish.NewCipher
