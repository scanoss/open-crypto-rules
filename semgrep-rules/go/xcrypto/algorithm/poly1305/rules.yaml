rules:
  - id: go.xcrypto.poly1305.mac
    message: Detected Poly1305 MAC usage, algorithm=Poly1305
    severity: INFO
    languages: [go]
    patterns:
      - pattern-either:
          - pattern-inside: |
              import (
                ...
                "golang.org/x/crypto/poly1305"
                ...
              )
              ...
          - pattern-inside: |
              import "golang.org/x/crypto/poly1305"
              ...
      - pattern: poly1305.New(...)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/poly1305
      crypto:
        assetType: algorithm
        findingType: mac
        operation: sign
        algorithmPrimitive: mac
        algorithmName: Poly1305
        algorithmFamily: Poly1305
        library: golang.org/x/crypto/poly1305
        api: poly1305.New

  - id: go.xcrypto.poly1305.sum
