rules:
  - id: go.xcrypto.chacha20poly1305.aead
    message: Detected ChaCha20-Poly1305 AEAD usage
    severity: INFO
    languages: [go]
    patterns:
      - pattern-either:
          - pattern-inside: |
              import (
                ...
                "golang.org/x/crypto/chacha20poly1305"
                ...
              )
              ...
          - pattern-inside: |
              import "golang.org/x/crypto/chacha20poly1305"
              ...
      - pattern-either:
          - patterns:
              - pattern: chacha20poly1305.$FUNC(make([]byte, $KEYSIZE))
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: "^New(?<variant>X?)$"
              - metavariable-regex:
                  metavariable: $KEYSIZE
                  regex: "^(?<keysize>32)$"
          - patterns:
              - pattern: chacha20poly1305.$FUNC(...)
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: "^New(?<variant>X?)$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/chacha20poly1305
      crypto:
        assetType: algorithm
        findingType: cipher
        algorithmPrimitive: ae
        algorithmName: $variantChaCha20-Poly1305
        algorithmFamily: ChaCha20
        algorithmParameterSetIdentifier: $keysize
        library: golang.org/x/crypto/chacha20poly1305
        api: chacha20poly1305.$FUNC

  - id: go.xcrypto.chacha20poly1305.constants
    message: Detected ChaCha20-Poly1305 constant usage, algorithm=ChaCha20-Poly1305
    severity: INFO
    languages: [go]
    patterns:
      - pattern-either:
          - pattern-inside: |
              import (
                ...
                "golang.org/x/crypto/chacha20poly1305"
                ...
              )
              ...
          - pattern-inside: |
              import "golang.org/x/crypto/chacha20poly1305"
              ...
      - pattern-either:
          - pattern: chacha20poly1305.KeySize
          - pattern: chacha20poly1305.NonceSize
          - pattern: chacha20poly1305.NonceSizeX
          - pattern: chacha20poly1305.Overhead
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/chacha20poly1305
      crypto:
        assetType: algorithm
        findingType: cipher
        algorithmPrimitive: ae
        algorithmName: ChaCha20-Poly1305
        algorithmFamily: ChaCha20
        algorithmParameterSetIdentifier: "256"
        library: golang.org/x/crypto/chacha20poly1305
        api: chacha20poly1305.KeySize
