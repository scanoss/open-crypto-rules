rules:
  - id: go.xcrypto.chacha20poly1305.new
    message: Detected ChaCha20-Poly1305 AEAD usage, algorithm=ChaCha20-Poly1305
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: chacha20poly1305.New(make([]byte, $KEYSIZE))
                  - pattern: |
                      $AEAD, $ERR := chacha20poly1305.New(make([]byte, $KEYSIZE))
                  - pattern: |
                      $AEAD, _ := chacha20poly1305.New(make([]byte, $KEYSIZE))
                  - pattern: |
                      $KEY := make([]byte, $KEYSIZE)
                      ...
                      chacha20poly1305.New($KEY)
              - metavariable-regex:
                  metavariable: $KEYSIZE
                  regex: "^(?<keysize>32)$"
          - pattern-either:
              - pattern: chacha20poly1305.New($KEY)
              - pattern: |
                  $AEAD, $ERR := chacha20poly1305.New($KEY)
              - pattern: |
                  $AEAD, _ := chacha20poly1305.New($KEY)
              - pattern: chacha20poly1305.New(...)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/chacha20poly1305
      crypto:
        assetType: algorithm
        findingType: cipher
        operation: encrypt
        primitive: ae
        algorithmName: ChaCha20-Poly1305
        algorithmFamily: ChaCha20
        parameterSetIdentifier: $keysize
        library: golang.org/x/crypto/chacha20poly1305
        api: chacha20poly1305.New

  - id: go.xcrypto.chacha20poly1305.newx
    message: Detected XChaCha20-Poly1305 AEAD usage, algorithm=XChaCha20-Poly1305
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: chacha20poly1305.NewX(make([]byte, $KEYSIZE))
                  - pattern: |
                      $AEAD, $ERR := chacha20poly1305.NewX(make([]byte, $KEYSIZE))
                  - pattern: |
                      $AEAD, _ := chacha20poly1305.NewX(make([]byte, $KEYSIZE))
                  - pattern: |
                      $KEY := make([]byte, $KEYSIZE)
                      ...
                      chacha20poly1305.NewX($KEY)
              - metavariable-regex:
                  metavariable: $KEYSIZE
                  regex: "^(?<keysize>32)$"
          - pattern-either:
              - pattern: chacha20poly1305.NewX($KEY)
              - pattern: |
                  $AEAD, $ERR := chacha20poly1305.NewX($KEY)
              - pattern: |
                  $AEAD, _ := chacha20poly1305.NewX($KEY)
              - pattern: chacha20poly1305.NewX(...)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/chacha20poly1305
      crypto:
        assetType: algorithm
        findingType: cipher
        operation: encrypt
        primitive: ae
        algorithmName: XChaCha20-Poly1305
        algorithmFamily: ChaCha20
        parameterSetIdentifier: $keysize
        library: golang.org/x/crypto/chacha20poly1305
        api: chacha20poly1305.NewX

  - id: go.xcrypto.chacha20poly1305.constants
    message: Detected ChaCha20-Poly1305 constant usage, algorithm=ChaCha20-Poly1305
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: chacha20poly1305.KeySize
          - pattern: chacha20poly1305.NonceSize
          - pattern: chacha20poly1305.NonceSizeX
          - pattern: chacha20poly1305.Overhead
          - pattern: $VAR := chacha20poly1305.KeySize
          - pattern: $VAR := chacha20poly1305.NonceSize
          - pattern: $VAR := chacha20poly1305.NonceSizeX
          - pattern: $VAR := chacha20poly1305.Overhead
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/chacha20poly1305
      crypto:
        assetType: algorithm
        findingType: cipher
        operation: encrypt
        primitive: ae
        algorithmName: ChaCha20-Poly1305
        algorithmFamily: ChaCha20
        parameterSetIdentifier: "256"
        library: golang.org/x/crypto/chacha20poly1305
        api: chacha20poly1305.KeySize
