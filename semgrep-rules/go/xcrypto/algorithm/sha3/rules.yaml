rules:
  - id: go.xcrypto.sha3.hash-224
    message: Detected SHA-3-224 hash usage, algorithm=SHA-3-224
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: sha3.New224()
          - pattern: "$HASHER := sha3.New224()

              "
          - pattern: var $HASHER hash.Hash = sha3.New224()
          - pattern: $HASHER := hash.Hash(sha3.New224())
          - pattern: sha3.New224
          - pattern: sha3.Sum224($DATA)
          - pattern: "$HASH := sha3.Sum224($DATA)

              "
          - pattern: sha3.Sum224
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/sha3
      crypto:
        assetType: algorithm
        findingType: hash
        operation: digest
        primitive: hash
        algorithmName: SHA-3-224
        algorithmFamily: SHA-3
        parameterSetIdentifier: "224"
        library: golang.org/x/crypto/sha3
        api: sha3.New224|sha3.Sum224

