          - pattern-inside: |
              import "golang.org/x/crypto/sha3"
              ...
      - patterns:
          - pattern: sha3.$FUNC
          - metavariable-regex:
              metavariable: $FUNC
              regex: "^(?:NewShake|ShakeSum)(?<variant>128|256)$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/sha3
      crypto:
        assetType: algorithm
        findingType: hash
        operation: digest
        algorithmPrimitive: xof
        algorithmName: SHAKE-$variant
        algorithmFamily: SHA-3
        algorithmParameterSetIdentifier: $variant
        library: golang.org/x/crypto/sha3
