rules:
  - id: go.xcrypto.otr.privatekey-generate
    message: Detected OTR private key generation, algorithm=OTR
    severity: INFO
    languages:
      - go
    patterns:
      - pattern: $PRIVKEY.Generate(...)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/otr
      crypto:
        assetType: algorithm
        findingType: key_generation
        operation: "keygen"
        algorithmPrimitive: signature
        algorithmName: OTR
        algorithmFamily: OTR
        library: golang.org/x/crypto/otr
        api: otr.PrivateKey.Generate
        materialSource: generated

  - id: go.xcrypto.otr.privatekey-sign
    message: Detected OTR private key signing, algorithm=OTR
    severity: INFO
    languages:
      - go
    patterns:
      - pattern: $PRIVKEY.Sign(...)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/otr
      crypto:
        assetType: algorithm
        findingType: signature
        operation: "sign"
        algorithmPrimitive: signature
        algorithmName: OTR
        algorithmFamily: OTR
        library: golang.org/x/crypto/otr
        api: otr.PrivateKey.Sign

  - id: go.xcrypto.otr.publickey-verify
    message: Detected OTR public key signature verification, algorithm=OTR
    severity: INFO
    languages:
      - go
    patterns:
      - pattern: $PUBKEY.Verify(...)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/golang.org/x/crypto/otr
      crypto:
        assetType: algorithm
        findingType: signature
        operation: "verify"
        algorithmPrimitive: signature
        algorithmName: OTR
        algorithmFamily: OTR
        library: golang.org/x/crypto/otr
        api: otr.PublicKey.Verify
