    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      cwe: [CWE-327, CWE-326]
      references:
        - https://pkg.go.dev/crypto/cipher
      crypto:
        assetType: algorithm
        findingType: cipher
        operation: "decrypt"
        algorithmPrimitive: block-cipher
        algorithmName: DES-$mode
        algorithmFamily: DES
        library: crypto/cipher
        api: cipher.$FUNC
        cipher: DES
        algorithmMode: $mode

  # ============================================================================
  # 3DES Cipher Modes - crypto/cipher
