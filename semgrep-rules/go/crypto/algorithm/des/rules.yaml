rules:
  - id: go.crypto.des.key-generation
    message: Detected DES key generation, algorithm=DES
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: des.NewCipher(make([]byte, $BYTESIZE))
                  - pattern: |
                      $KEY := make([]byte, $BYTESIZE)
                      ...
                      des.NewCipher($KEY)
              - metavariable-regex:
                  metavariable: $BYTESIZE
                  regex: "^8$"
          - pattern: des.NewCipher([]byte($STRING))
          - pattern: des.NewCipher($KEY)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      cwe:
        - CWE-327
        - CWE-326
      references:
        - https://pkg.go.dev/crypto/des
      crypto:
        assetType: algorithm
        findingType: key_generation
        operation: keygen
        algorithmName: DES
        algorithmFamily: DES
        library: crypto/des
        api: des.NewCipher
        materialSource: generated
        algorithmPrimitive: block-cipher
        algorithmParameterSetIdentifier: "56"

  - id: go.crypto.des.block-cipher-mode
    message: Detected DES block cipher mode
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: |
              $BLOCK, $ERR := des.NewCipher($KEY)
              ...
              cipher.$FUNC($BLOCK, ...)
          - pattern: cipher.$FUNC(des.NewCipher($KEY), ...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: "^New(?<mode>CBC|CTR|OFB|CFB)(Encrypter|Decrypter)?$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      cwe:
        - CWE-327
        - CWE-326
      references:
        - https://pkg.go.dev/crypto/cipher
      crypto:
        assetType: algorithm
        findingType: cipher
        operation: encrypt
        algorithmName: DES-$1
        algorithmFamily: DES
        library: crypto/cipher
        api: cipher.New$1
        cipher: DES
        algorithmMode: $1
        algorithmPrimitive: block-cipher
