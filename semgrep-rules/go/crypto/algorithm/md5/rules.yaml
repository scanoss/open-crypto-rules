rules:
  - id: go.crypto.md5.hash-usage
    message: Detected MD5 hash usage with algorithm=MD5, hash_algorithm=MD5
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: md5.New()
          - pattern: "$HASHER := md5.New()

              "
          - pattern: var $HASHER hash.Hash = md5.New()
          - pattern: $HASHER := hash.Hash(md5.New())
          - pattern: crypto.MD5.New()
          - pattern: "$HASH_CONST := crypto.MD5

              ...

              $HASH_CONST.New()

              "
          - pattern: md5.Sum($DATA)
          - pattern: "$HASH := md5.Sum($DATA)

              "
          - pattern: md5.New
          - pattern: crypto.MD5.New
          - pattern: md5.Sum(...)
          - pattern: crypto.MD5
          - pattern: $VAR := md5.Sum(...)
          - pattern: $VAR := crypto.MD5
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      cwe:
        - CWE-327
      references:
        - https://pkg.go.dev/crypto/md5
      crypto:
        assetType: algorithm
        findingType: hash
        operation: digest
        algorithmName: MD5
        algorithmFamily: MD5
        library: crypto/md5
        api: md5.New
        algorithmPrimitive: hash
        algorithmParameterSetIdentifier: "128"
