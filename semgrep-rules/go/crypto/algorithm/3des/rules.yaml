rules:
  - id: go.crypto.3des.key-generation
    message: Detected 3DES key generation, algorithm=3DES
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: des.NewTripleDESCipher(make([]byte, $BYTESIZE))
                  - pattern: |
                      $KEY := make([]byte, $BYTESIZE)
                      ...
                      des.NewTripleDESCipher($KEY)
              - metavariable-regex:
                  metavariable: $BYTESIZE
                  regex: "^24$"
          - pattern: des.NewTripleDESCipher([]byte($STRING))
          - pattern: des.NewTripleDESCipher($KEY)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      cwe:
        - CWE-327
        - CWE-326
      references:
        - https://pkg.go.dev/crypto/des
      crypto:
        assetType: algorithm
        findingType: key_generation
        operation: keygen
        algorithmName: 3DES
        algorithmFamily: 3DES
        library: crypto/des
        api: des.NewTripleDESCipher
        materialSource: generated
        algorithmPrimitive: block-cipher
        algorithmParameterSetIdentifier: "168"

  - id: go.crypto.3des.block-cipher-mode
    message: Detected 3DES block cipher mode
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: |
              $BLOCK, $ERR := des.NewTripleDESCipher($KEY)
              ...
              cipher.$FUNC($BLOCK, ...)
          - pattern: cipher.$FUNC(des.NewTripleDESCipher($KEY), ...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: "^New(?<mode>CBC|CTR|OFB|CFB)(Encrypter|Decrypter)?$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      cwe:
        - CWE-327
        - CWE-326
      references:
        - https://pkg.go.dev/crypto/cipher
      crypto:
        assetType: algorithm
        findingType: cipher
        operation: encrypt
        algorithmName: 3DES-$1
        algorithmFamily: 3DES
        library: crypto/cipher
        api: cipher.New$1
        cipher: 3DES
        algorithmMode: $1
        algorithmPrimitive: block-cipher
