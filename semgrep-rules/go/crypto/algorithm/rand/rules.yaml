rules:
  - id: go.crypto.rand.usage
    message: Detected cryptographically secure random number generation
    severity: INFO
    languages: [go]
    patterns:
      - pattern-inside: |
          import (
            ...
            "crypto/rand"
            ...
          )
          ...
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: rand.$FUNC(...)
                  - pattern: rand.$FUNC
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: "^(?<func>Read|Reader|Prime|Int|Text)$"
          - patterns:
              - pattern: rand.Reader.$METHOD(...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: "^(?<func>Read)$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      cwe: [CWE-330]
      references:
        - https://pkg.go.dev/crypto/rand
      crypto:
        assetType: algorithm
        findingType: rng
        operation: other
        algorithmPrimitive: drbg
        algorithmName: CSPRNG
        algorithmFamily: CSPRNG
        library: crypto/rand
        api: rand.$func
        materialSource: generated
