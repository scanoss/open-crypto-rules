rules:
  - id: go.crypto.sha512.hash-usage-512
    message: Detected SHA-512 hash usage
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: sha512.New
          - pattern: sha512.Sum512
          - pattern: crypto.SHA512
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/crypto/sha512
      crypto:
        assetType: algorithm
        findingType: hash
        operation: "digest"
        algorithmName: SHA-512
        algorithmFamily: SHA-2
        library: crypto/sha512
        api: crypto.SHA512
        algorithmPrimitive: hash
        algorithmParameterSetIdentifier: "512"

  - id: go.crypto.sha512.hash-usage-384
