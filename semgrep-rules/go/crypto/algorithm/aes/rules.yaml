rules:
  - id: go.crypto.aes.key-generation
    message: Detected AES key generation, algorithm=AES
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: aes.NewCipher(make([]byte, $BYTESIZE))
                  - pattern: |
                      $KEY := make([]byte, $BYTESIZE)
                      ...
                      aes.NewCipher($KEY)
              - metavariable-regex:
                  metavariable: $BYTESIZE
                  regex: "^(?<bytesize>16|24|32)$"
          - pattern: aes.NewCipher([]byte($STRING))
          - pattern: aes.NewCipher($KEY)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      cwe:
        - CWE-326
      references:
        - https://pkg.go.dev/crypto/aes
      crypto:
        assetType: algorithm
        findingType: key_generation
        operation: keygen
        algorithmName: AES
        algorithmFamily: AES
        library: crypto/aes
        api: aes.NewCipher
        materialSource: generated
        algorithmPrimitive: block-cipher
        algorithmParameterSetIdentifier: $bytesize

  - id: go.crypto.aes.gcm-mode
    message: Detected AES-GCM mode (AEAD), algorithm=AES-GCM, cipher=AES, mode=GCM
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: |
              $BLOCK, $ERR := aes.NewCipher($KEY)
              ...
              cipher.$FUNC($BLOCK, ...)
          - pattern: cipher.$FUNC(aes.NewCipher($KEY), ...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: "^(?<func>NewGCM(?:WithNonceSize|WithTagSize|WithRandomNonce)?)$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/crypto/cipher
      crypto:
        assetType: algorithm
        findingType: cipher
        operation: encrypt
        algorithmName: AES-GCM
        algorithmFamily: AES
        library: crypto/cipher
        api: cipher.$func
        cipher: AES
        algorithmMode: gcm
        algorithmPrimitive: ae

  - id: go.crypto.aes.block-cipher-mode
    message: Detected AES block cipher mode
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: |
              $BLOCK, $ERR := aes.NewCipher($KEY)
              ...
              cipher.$FUNC($BLOCK, ...)
          - pattern: cipher.$FUNC(aes.NewCipher($KEY), ...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: "^New(?<mode>CBC|CTR|OFB|CFB)(Encrypter|Decrypter)?$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://pkg.go.dev/crypto/cipher
      crypto:
        assetType: algorithm
        findingType: cipher
        operation: encrypt
        algorithmName: AES-$1
        algorithmFamily: AES
        library: crypto/cipher
        api: cipher.New$1
        cipher: AES
        algorithmMode: $1
        algorithmPrimitive: block-cipher
