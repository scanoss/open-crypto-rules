rules:
  - id: rust.native-tls.tls.protocol-version
    message: Detected TLS protocol version configuration
    severity: INFO
    languages: [rust]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  use $IMPORT;
                  ...
              - pattern-either:
                  - pattern: $BUILDER.min_protocol_version($VERSION)
                  - pattern: $BUILDER.max_protocol_version($VERSION)
              - metavariable-regex:
                  metavariable: $IMPORT
                  regex: "native_tls"
              - metavariable-regex:
                  metavariable: $VERSION
                  regex: "^(?:native_tls::)?(?:Protocol::)?Tlsv(?<major>1)(?<minor>[0-3])$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      cwe: [CWE-757]
      references:
        - https://docs.rs/native-tls/
      crypto:
        assetType: protocol
        findingType: key_exchange
        operation: keyexchange
        protocolName: TLS
        protocolType: tls
        protocolVersion: $major.$minor
        library: native-tls
