rules:
  - id: rust.openssl.tls.ssl-acceptor-modern
    message: Detected TLS server configuration using mozilla_modern preset
    severity: INFO
    languages: [rust]
    patterns:
      - pattern-either:
          - pattern: openssl::ssl::SslAcceptor::mozilla_modern($METHOD)
          - pattern: openssl::ssl::SslAcceptor::mozilla_modern_v5($METHOD)
          - patterns:
              - pattern-inside: |
                  use $IMPORT;
                  ...
              - pattern-either:
                  - pattern: SslAcceptor::mozilla_modern($METHOD)
                  - pattern: SslAcceptor::mozilla_modern_v5($METHOD)
              - metavariable-regex:
                  metavariable: $IMPORT
                  regex: ".*openssl.*"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://docs.rs/openssl/
      crypto:
        assetType: protocol
        findingType: protocol
        operation: init
        protocolName: TLS
        algorithmFamily: TLS
        library: openssl
        securityProfile: mozilla_modern

