rules:
  - id: rust.openssl.x509.from-pem
    message: Detected X.509 certificate loading from PEM
    severity: INFO
    languages: [rust]
    patterns:
      - pattern-either:
          - pattern: openssl::x509::X509::from_pem($DATA)
          - patterns:
              - pattern-inside: |
                  use $IMPORT;
                  ...
              - pattern: X509::from_pem($DATA)
              - metavariable-regex:
                  metavariable: $IMPORT
                  regex: ".*openssl.*"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://docs.rs/openssl/
      crypto:
        assetType: certificate
        findingType: certificate
        operation: load
        certificateFormat: PEM
        library: openssl
        algorithmFamily: X509

