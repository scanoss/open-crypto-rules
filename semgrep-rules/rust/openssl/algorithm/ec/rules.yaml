      - pattern-either:
          - pattern: openssl::ec::EcKey::generate($GROUP)
          - pattern: openssl::ec::EcKey::from_private_components($GROUP, $PRIVATE, $PUBLIC)
          - pattern: openssl::ec::EcKey::private_key_from_pem($PEM)
          - pattern: openssl::ec::EcKey::private_key_from_der($DER)
          - pattern: EcKey::generate($GROUP)
          - pattern: EcKey::from_private_components($GROUP, $PRIVATE, $PUBLIC)
          - pattern: EcKey::private_key_from_pem($PEM)
          - pattern: EcKey::private_key_from_der($DER)
    pattern-sinks:
      - pattern: $KEY.private_key_to_der()
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://docs.rs/openssl/
      crypto:
