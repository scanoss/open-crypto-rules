rules:
  - id: rust.openssl.ec.curve-from-name
    message: Detected elliptic curve selection via openssl
    severity: INFO
    languages: [rust]
    patterns:
      - pattern-either:
          - pattern: openssl::ec::EcGroup::from_curve_name($NID)
          - patterns:
              - pattern-inside: |
                  use $IMPORT;
                  ...
              - pattern: EcGroup::from_curve_name($NID)
              - metavariable-regex:
                  metavariable: $IMPORT
                  regex: ".*openssl.*"
      - metavariable-regex:
          metavariable: $NID
          regex: "(?:Nid::)?(X9_62_PRIME256V1|SECP384R1|SECP521R1|SECP256K1|X25519|ED25519|SECP224R1|SECP224K1|SECP192K1|PRIME192V1)"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://docs.rs/openssl/
      crypto:
        assetType: algorithm
        findingType: signature
        algorithmName: EC
        algorithmFamily: EC
        library: openssl
        algorithmPrimitive: signature
        ellipticCurve: $NID

