          - pattern: Rsa::private_key_from_der($DER)
    pattern-sinks:
      - pattern-either:
          - pattern: $RSA.private_decrypt($CIPHERTEXT, $PLAINTEXT, openssl::rsa::Padding::PKCS1_OAEP)
          - pattern: $RSA.private_decrypt($CIPHERTEXT, $PLAINTEXT, Padding::PKCS1_OAEP)
    metadata:
