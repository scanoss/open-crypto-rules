  - id: rust.openssl.rsa.private-key-to-der
    message: Detected RSA private key export to DER using openssl
    severity: INFO
    mode: taint
    languages: [rust]
    pattern-sources:
      - pattern-either:
          - pattern: openssl::rsa::Rsa::generate($BITS)
          - pattern: openssl::rsa::Rsa::generate_with_e($BITS, $E)
          - pattern: openssl::rsa::Rsa::from_private_components($N, $E, $D, $P, $Q, $DMP1, $DMQ1, $IQMP)
          - pattern: openssl::rsa::Rsa::private_key_from_pem($PEM)
          - pattern: openssl::rsa::Rsa::private_key_from_der($DER)
          - pattern: Rsa::generate($BITS)
          - pattern: Rsa::generate_with_e($BITS, $E)
          - pattern: Rsa::from_private_components($N, $E, $D, $P, $Q, $DMP1, $DMQ1, $IQMP)
          - pattern: Rsa::private_key_from_pem($PEM)
          - pattern: Rsa::private_key_from_der($DER)
    pattern-sinks:
      - pattern: $RSA.private_key_to_der()
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://docs.rs/openssl/
      crypto:
        assetType: algorithm
