rules:
  - id: rust.openssl.rsa.keygen
    message: Detected RSA key generation using openssl
    severity: INFO
    languages: [rust]
    patterns:
      - pattern-either:
          - pattern: openssl::rsa::Rsa::generate($BITS)
          - patterns:
              - pattern-inside: |
                  use $IMPORT;
                  ...
              - pattern: Rsa::generate($BITS)
              - metavariable-regex:
                  metavariable: $IMPORT
                  regex: ".*openssl.*"
      - metavariable-regex:
          metavariable: $BITS
          regex: "(?P<bits>1024|2048|3072|4096|8192)"
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://docs.rs/openssl/
      crypto:
        assetType: algorithm
        findingType: pke
        operation: "keygen"
        algorithmName: RSA
        algorithmFamily: RSA
        library: openssl
        algorithmPrimitive: pke
        algorithmParameterSetIdentifier: $bits

  - id: rust.openssl.rsa.keygen-variable
    message: Detected RSA key generation using openssl with variable key size
    severity: INFO
    languages: [rust]
    patterns:
      - pattern-either:
          - pattern: openssl::rsa::Rsa::generate($BITS)
          - patterns:
              - pattern-inside: |
                  use $IMPORT;
                  ...
              - pattern: Rsa::generate($BITS)
              - metavariable-regex:
                  metavariable: $IMPORT
                  regex: ".*openssl.*"
      - metavariable-regex:
          metavariable: $BITS
          regex: "^[a-zA-Z_][a-zA-Z0-9_]*$"
    metadata:
      category: security
      subcategory: cryptography
      confidence: MEDIUM
      references:
        - https://docs.rs/openssl/
      crypto:
        assetType: algorithm
        findingType: pke
        operation: "keygen"
        algorithmName: RSA
        algorithmFamily: RSA
        library: openssl
        algorithmPrimitive: pke

  - id: rust.openssl.rsa.keygen-with-exponent
