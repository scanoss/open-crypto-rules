          - pattern: openssl::rsa::Rsa::private_key_from_der($DER)
          - pattern: Rsa::generate($BITS)
          - pattern: Rsa::generate_with_e($BITS, $E)
          - pattern: Rsa::from_private_components($N, $E, $D, $P, $Q, $DMP1, $DMQ1, $IQMP)
          - pattern: Rsa::private_key_from_pem($PEM)
          - pattern: Rsa::private_key_from_der($DER)
    pattern-sinks:
      - pattern-either:
          - pattern: $RSA.private_key_to_pem()
          - pattern: $RSA.private_key_to_pem_passphrase($CIPHER, $PASSPHRASE)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
