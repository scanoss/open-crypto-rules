    severity: INFO
    mode: taint
    languages: [rust]
    pattern-sources:
      - pattern-either:
          - pattern: openssl::rsa::Rsa::generate($BITS)
          - pattern: openssl::rsa::Rsa::from_private_components($N, $E, $D, $P, $Q, $DMP1, $DMQ1, $IQMP)
          - pattern: openssl::rsa::Rsa::private_key_from_pem($PEM)
