rules:
  - id: rust.openssl.sha224.hash-usage
    message: Detected SHA-224 hash usage
    severity: INFO
    languages: [rust]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  use $IMPORT;
                  ...
              - pattern-either:
                  - pattern: sha::Sha224::new()
                  - pattern: sha224(...)
                  - pattern: MessageDigest::sha224()
                  - pattern: Md::sha224()
                  - pattern: md::Md::sha224()
                  - pattern: MessageDigest::from_nid(Nid::SHA224)
                  - pattern: Md::from_nid(Nid::SHA224)
              - metavariable-regex:
                  metavariable: $IMPORT
                  regex: ".*openssl.*"
          - pattern: openssl::sha::sha224(...)
          - pattern: openssl::sha::Sha224::new()
          - pattern: openssl::hash::MessageDigest::sha224()
          - pattern: openssl::md::Md::sha224()
          - pattern: openssl::hash::MessageDigest::from_nid(openssl::nid::Nid::SHA224)
          - pattern: openssl::md::Md::from_nid(openssl::nid::Nid::SHA224)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      references:
        - https://docs.rs/openssl/
      crypto:
        assetType: algorithm
        findingType: hash
        operation: "digest"
        algorithmName: SHA-224
        algorithmFamily: SHA-2
        library: openssl
        algorithmPrimitive: hash
        algorithmParameterSetIdentifier: "224"

